name: build-and-push

# MusicFlow 镜像发布(GHCR + Docker Hub 双推送)。
#
# 触发:
#   - push 到 main:自动构建 :latest / :main(版本号由 git describe 自动生成,去 v 前缀)。
#   - 打 v* tag:发布 <版本> + :latest(版本锁定的发版语义)。
#   - workflow_dispatch:手动构建 :latest + :main。
#
# 方案 A(非阻塞发版 + 失败自动回滚):
#   镜像构建与推送「不阻塞」——push 即出镜像、tag 即出正式版 Release,发版最快。
#   全量测试门禁(vitest + tsc)与构建「并行」跑;若测试失败,rollback job 将
#   :latest / :main / :<version> 回滚到本次推送前的 digest(manifest 复制,秒级,
#   不重拉层),并删除刚创建的 GitHub Release(仅 tag),实现「测试不过则自动撤回发版」。
#   ⚠️ 因此测试必须稳定:任何环境偶发(如硬编码端口 EADDRINUSE)会被误判为失败并触发回滚,
#      上线前务必修掉 flaky 用例(改用 listen(0) 拿临时端口)。
#
#   纯文档提交(**/*.md、docs/**)不触发本流程,避免无意义重建(CHANGELOG 改动即典型场景)。
#
# 前置条件(仓库 Secrets,已配置):
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN —— 缺失时自动跳过 Docker Hub 推送。

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

env:
  IMAGE_NAME: musicflow
  # Docker Hub 命名空间 = 账号用户名(与 GHCR 的 org 路径不同)。
  DH_NAMESPACE: ray5378

# 手动构建可被新触发打断;tag 构建必须跑完(发版不可取消)。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # 全量测试门禁(vitest + tsc):「非阻塞」——与 build 并行跑,失败由 rollback 撤回发版。
  # tag 推送不经过 ci.yml,此处独立重跑保证「测试不过则撤回」;main 推送时与 ci.yml
  # 的 test 并行(不增加墙钟)。ci.yml 的 test 只覆盖 push main/PR,二者互不影响。
  test:
    name: 全量测试门禁 (vitest, 非阻塞/失败回滚)
    runs-on: ubuntu-latest
    # vitest 已切 singleFork 单进程串行(规避 forks 多 worker 派发死锁),给 20 分钟裕量。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: cd backend && npm ci
      - name: TypeScript 类型检查
        run: cd backend && npx tsc --noEmit
      - name: 全量测试(含导入门禁契约 + 转码链路契约)
        shell: bash
        # 关闭 vitest console 截获(与 backend/vitest.config.ts、sendspin-guard.yml 同源):
        # sendspin 测试文件停服务后仍有迟到 console 输出(自有 pushLoop / ws 关闭回调 +
        # 第三方 bonjour 名称冲突探测),经 Vitest 5 的 onUserConsoleLog worker→主进程 RPC
        # 在 worker teardown 时被判为 unhandled error,导致「全量用例全过」却 exit 1 —— 在
        # build.yml 会误触发回滚发版。关掉截获后日志仍完整落在 CI 日志与失败 artifact。
        env:
          MUSICFLOW_GUARD_NO_CONSOLE_INTERCEPT: "1"
        run: |
          set -o pipefail
          cd backend
          npx vitest run 2>&1 | tee /tmp/vitest.log
      - name: 上传失败日志(便于排查顺序相关偶发;含挂起被取消场景,取消防台同样回传)
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-log
          path: /tmp/vitest.log
          if-no-files-found: ignore
          retention-days: 3

  # 非阻塞构建:push 即出镜像、tag 即出正式版,不等测试门禁。
  build:
    name: 构建并推送镜像 (非阻塞)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      old_digest: ${{ steps.capture.outputs.digest }}
    permissions:
      contents: write
      packages: write
    # secrets 不能直接在 if 里引用,经 job 级 env 中转(未配置时为空串,登录步骤自动跳过)。
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DH_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DH_USER }}
          password: ${{ env.DH_TOKEN }}

      # 捕获「本次推送前」的 :latest digest,供 test 失败时回滚。
      # 首次构建(无 :latest)时 inspect 失败属正常,置空 digest 即不回滚。
      - name: 捕获回滚基线 digest
        id: capture
        run: |
          GHCR=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          if DIGEST=$(docker buildx imagetools inspect "$GHCR:latest" --format '{{index .Manifest.Digest}}' 2>/dev/null) && [ -n "$DIGEST" ]; then
            echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
            echo "captured baseline: $DIGEST"
          else
            echo "digest=" >> "$GITHUB_OUTPUT"
            echo "no previous :latest, nothing to roll back to"
          fi

      - name: Compute tags
        id: meta
        run: |
          GHCR=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          DH=${{ env.DH_NAMESPACE }}/${{ env.IMAGE_NAME }}
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V=${GITHUB_REF#refs/tags/v}
            VERSION="$V"
            TAGS="$GHCR:$V,$GHCR:latest,$DH:$V,$DH:latest"
          else
            # 直接推 :latest(提交即更新"最新镜像"),附 :main 便于回溯。
            VERSION=$(git describe --tags --abbrev=7 2>/dev/null | sed 's/^v//' || echo "main-$SHORT_SHA")
            TAGS="$GHCR:latest,$GHCR:main,$DH:latest,$DH:main"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "resolved: version=$VERSION tags=$TAGS"

      - name: Build and push (amd64 only, 非阻塞)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ steps.meta.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release (tag only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${{ steps.meta.outputs.version }}"
          # 幂等:同一 tag 重跑时跳过,避免重复创建报错。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
            exit 0
          fi
          # 模板正文 + 自动生成的变更日志 + 涉及文件统计。
          PREV=$(git tag --sort=-version:refname | sed -n '2p')
          {
            echo "## ${TAG#v} 发布说明"
            echo
            echo "### 变更"
            echo "> 由提交历史按类型自动生成:新功能 / Bug 修复 / 优化·重构·依赖 / 文档 / 其他。"
            echo
            bash scripts/gen-changelog.sh "$TAG"
            echo
            echo "### 涉及文件与影响面"
            if [ -n "$PREV" ]; then
              git diff --stat "$PREV" "$TAG"
            else
              git show --stat "$TAG"
            fi
            echo
            echo "### 镜像"
            echo "- ghcr.io/${GITHUB_REPOSITORY_OWNER}/musicflow:${VERSION} (Docker Hub 同步: ${DH_NAMESPACE}/musicflow:${VERSION})"
            echo
            echo "### 升级步骤"
            echo "- 加载项/容器直接拉取最新镜像重建重启即可;数据自动迁移保留。"
            echo "- 若依赖上一版本新增索引/缓存,首次启动会自动补齐,无需手工操作。"
          } > /tmp/release-body.md
          gh release create "$TAG" --title "${TAG#v}" --notes-file /tmp/release-body.md

  # 回滚:test 失败且 build 成功时,将 :latest / :main / :<version> 回滚到本次推送前的
  # baseline digest(manifest 复制,秒级,不重拉层);tag 推送额外删除刚创建的 Release。
  # 仅在 test 真正 failure 时触发(always() 允许其越过失败的 needs 运行)。
  rollback:
    name: 回滚发版 (test 失败时)
    runs-on: ubuntu-latest
    needs: [build, test]
    if: always() && needs.test.result == 'failure' && needs.build.result == 'success'
    permissions:
      contents: write
      packages: write
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DH_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DH_USER }}
          password: ${{ env.DH_TOKEN }}

      - name: 回滚镜像 tag 到基线 digest
        if: ${{ needs.build.outputs.old_digest != '' }}
        run: |
          GHCR=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          DH=${{ env.DH_NAMESPACE }}/${{ env.IMAGE_NAME }}
          SRC="$GHCR@${{ needs.build.outputs.old_digest }}"
          echo "rolling back to baseline $SRC"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${{ needs.build.outputs.version }}"
            docker buildx imagetools create "$SRC" --tag "$GHCR:latest" --tag "$GHCR:$V"
            if [ -n "${{ env.DH_TOKEN }}" ]; then
              docker buildx imagetools create "$SRC" --tag "$DH:latest" --tag "$DH:$V"
            fi
          else
            docker buildx imagetools create "$SRC" --tag "$GHCR:latest" --tag "$GHCR:main"
            if [ -n "${{ env.DH_TOKEN }}" ]; then
              docker buildx imagetools create "$SRC" --tag "$DH:latest" --tag "$DH:main"
            fi
          fi

      - name: 删除刚创建的 Release (tag only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release delete "$TAG" --yes || true
          echo "rolled back release $TAG"

  # 容器镜像漏洞扫描(发版后最后一关,非阻塞):Trivy 对「构建产物镜像」做层扫描,
  # 结果上报 Security tab 不阻塞发布。依赖 build 的 version 输出拿到实际镜像 tag。
  image-scan:
    name: 容器镜像漏洞扫描 (Trivy image)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write
      packages: read
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像 tag 解析:tag 触发时 build 会推送 <version>;main push / 手动构建只推送
      # :latest + :main,此时扫 :main 即可拿到同一产物。
      - name: Resolve image tag
        id: resolve
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ needs.build.outputs.version }}"
          else
            TAG="main"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Pull built image
        run: docker pull ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.resolve.outputs.tag }}

      - name: Trivy 镜像扫描 (HIGH/CRITICAL, 免修复忽略)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          scan-ref: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.resolve.outputs.tag }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          # 镜像层漏洞(系统包)常有基础镜像自带的,以上报+人工处置为主。
          exit-code: "0"

      - name: 上传 SARIF 到 Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
