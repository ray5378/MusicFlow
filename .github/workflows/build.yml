name: build-and-push

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE_NAME: musicflow

# Superseded main builds are pointless; tag builds must never be cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          GHCR=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          DH=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          # `git push && git push --tags` fires two runs at once. Both used to
          # publish :latest, so whichever finished last won — and when that was
          # the branch run, :latest shipped APP_VERSION=main-<sha>, which is
          # exactly the bogus version users saw on the settings page.
          # Fix: only tag runs may move :latest; main builds get their own
          # rolling :main tag.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V=${GITHUB_REF#refs/tags/v}
            VERSION="$V"
            TAGS="$GHCR:$V,$DH:$V,$GHCR:latest,$DH:latest"
          else
            VERSION="main-$(echo "$GITHUB_SHA" | cut -c1-7)"
            TAGS="$GHCR:main,$DH:main"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "resolved: version=$VERSION tags=$TAGS"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
