name: build-and-push

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE_NAME: musicflow

# Superseded main builds are pointless; tag builds must never be cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # Build each architecture NATIVELY on its own runner, in parallel.
  # - amd64  -> ubuntu-latest (x86_64)
  # - arm64  -> ubuntu-24.04-arm (native ARM, NO QEMU emulation)
  # This removes the slow QEMU emulation that previously made the multi-arch
  # build take ~15+ min, and the two jobs run concurrently.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          GHCR=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          DH=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V=${GITHUB_REF#refs/tags/v}
            VERSION="$V"
          else
            # 版本号用 git describe 生成(最近 tag + 提交数 + sha, 如
            # 1.1.17-3-gabc1234),既真实可溯源,也不再显示无意义的 main-<sha>。
            VERSION=$(git describe --tags --abbrev=7 2>/dev/null || echo "main-$SHORT_SHA")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          # Each arch is pushed to its own per-arch tag; the manifest job
          # later merges them into the multi-arch :latest / version / :main.
          TAGS="$GHCR:${VERSION}-${{ matrix.arch }},$DH:${VERSION}-${{ matrix.arch }}"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "resolved: version=$VERSION arch=${{ matrix.arch }} tags=$TAGS"

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ steps.meta.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Merge the two per-arch images into a single multi-arch manifest list
  # (so `docker pull musicflow:latest` still resolves per platform). No build
  # happens here — only `docker buildx imagetools create` (requires no QEMU).
  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          set -euo pipefail
          GHCR="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"
          DH="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            T="${GITHUB_REF#refs/tags/v}"
          else
            T="main"
          fi
          echo "Combining per-arch images into $T / latest"
          docker buildx imagetools create \
            --tag "$GHCR:$T" --tag "$GHCR:latest" \
            "$GHCR:$T-amd64" "$GHCR:$T-arm64"
          docker buildx imagetools create \
            --tag "$DH:$T" --tag "$DH:latest" \
            "$DH:$T-amd64" "$DH:$T-arm64"
          echo "Done: $GHCR:$T, $GHCR:latest, $DH:$T, $DH:latest"
