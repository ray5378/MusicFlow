name: build-and-push

# MusicFlow 镜像发布(GHCR + Docker Hub 双推送)。
#
# 触发:
#   - push 到 main:自动构建 :latest(版本号由 git describe 自动生成,去 v 前缀),
#     并附 :main 便于回溯;提交即出新镜像,无需手动指定版本。
#   - 打 v* tag:发布 <版本> + :latest(版本锁定的发版语义——加载项钉具体版本号)。
#   - workflow_dispatch:手动构建 :latest + :main(与 main push 相同)。
#
# 打 v* tag 时除构建镜像外,还会自动创建 GitHub 正式版 Release(模板 + 变更列表,
# 已存在则跳过);形成「打 tag → 出镜像 + 正式版」的完整发布闭环。
#
# 前置条件(仓库 Secrets,已配置):
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN —— Docker Hub 登录凭据,缺失时自动跳过
#   Docker Hub 推送(镜像仍会推到 GHCR,不影响发版)。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE_NAME: musicflow
  # Docker Hub 命名空间 = 账号用户名(与 GHCR 的 org 路径不同)。
  DH_NAMESPACE: ray5378

# 手动构建可被新触发打断;tag 构建必须跑完(发版不可取消)。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # Single-arch (amd64) build. No QEMU, no multi-arch manifest — the image is
  # pushed directly to <version> / :latest. ARM devices cannot run this image
  # (账号没有 ARM runner,与 V1 一致)。
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    # secrets 不能直接在 if 里引用,经 job 级 env 中转(未配置时为空串,登录步骤自动跳过)。
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DH_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DH_USER }}
          password: ${{ env.DH_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          GHCR=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          DH=${{ env.DH_NAMESPACE }}/${{ env.IMAGE_NAME }}
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V=${GITHUB_REF#refs/tags/v}
            VERSION="$V"
            TAGS="$GHCR:$V,$GHCR:latest,$DH:$V,$DH:latest"
          else
            # main push / 手动构建:版本号由 git describe 自动生成,不需要用户指定。
            # 去掉 v 前缀(git tag 是 v1.5.0,describe 输出 v1.5.0-8-g595a0d8),
            # APP_VERSION 必须是纯版本号,否则插件 minAppVersion 比较会把 v1 解析成 0 而误跳过。
            # 直接推 :latest(提交即更新"最新镜像"),附 :main 便于回溯。
            VERSION=$(git describe --tags --abbrev=7 2>/dev/null | sed 's/^v//' || echo "main-$SHORT_SHA")
            TAGS="$GHCR:latest,$GHCR:main,$DH:latest,$DH:main"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "resolved: version=$VERSION tags=$TAGS"

      - name: Build and push (amd64 only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ steps.meta.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release (tag only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${{ steps.meta.outputs.version }}"
          # 幂等:同一 tag 重跑时跳过,避免重复创建报错。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
            exit 0
          fi
          # 模板正文 + 自动生成的变更日志(按类型分组,见 scripts/gen-changelog.sh)
          # + 涉及文件统计(中文,列具体修改点,符合 SPEC 提交/发版规范)。
          PREV=$(git tag --sort=-version:refname | sed -n '2p')
          {
            echo "## ${TAG#v} 发布说明"
            echo
            echo "### 变更"
            echo "> 由提交历史按类型自动生成:新功能 / Bug 修复 / 优化·重构·依赖 / 文档 / 其他。"
            echo
            bash scripts/gen-changelog.sh "$TAG"
            echo
            echo "### 涉及文件与影响面"
            if [ -n "$PREV" ]; then
              git diff --stat "$PREV" "$TAG"
            else
              git show --stat "$TAG"
            fi
            echo
            echo "### 镜像"
            echo "- ghcr.io/${GITHUB_REPOSITORY_OWNER}/musicflow:${VERSION} (Docker Hub 同步: ${DH_NAMESPACE}/musicflow:${VERSION})"
            echo
            echo "### 升级步骤"
            echo "- 加载项/容器直接拉取最新镜像重建重启即可;数据自动迁移保留。"
            echo "- 若依赖上一版本新增索引/缓存,首次启动会自动补齐,无需手工操作。"
          } > /tmp/release-body.md
          gh release create "$TAG" --title "${TAG#v}" --notes-file /tmp/release-body.md
