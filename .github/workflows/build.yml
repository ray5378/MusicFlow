name: build-and-push

# MusicFlow-V2 镜像发布(GHCR + Docker Hub 双推送)。
#
# 触发:打 v* tag 时发布 <版本> + :latest 到 ghcr.io/ray5378/musicflow-v2
# 与 docker.io/ray5378/musicflow-v2;workflow_dispatch 手动触发时也自动构建
# :latest(版本号由 git describe 自动生成,无需手动指定升级版本),并附 :master
# 便于回溯手动构建来源。tag 触发仍保持版本锁定的发版语义——加载项钉的是
# 具体版本号,发布流程不变。
#
# 前置条件(仓库 Secrets,已配置):
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN —— Docker Hub 登录凭据,缺失时自动跳过
#   Docker Hub 推送(镜像仍会推到 GHCR,不影响发版)。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE_NAME: musicflow-v2
  # Docker Hub 命名空间 = 账号用户名(与 GHCR 的 org 路径不同)。
  DH_NAMESPACE: ray5378

# 手动构建可被新触发打断;tag 构建必须跑完(发版不可取消)。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # Single-arch (amd64) build. No QEMU, no multi-arch manifest — the image is
  # pushed directly to <version> / :latest. ARM devices cannot run this image
  # (账号没有 ARM runner,与 V1 一致)。
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          GHCR=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          DH=${{ env.DH_NAMESPACE }}/${{ env.IMAGE_NAME }}
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V=${GITHUB_REF#refs/tags/v}
            VERSION="$V"
            TAGS="$GHCR:$V,$GHCR:latest,$DH:$V,$DH:latest"
          else
            # 手动构建:版本号由 git describe 自动生成,不需要用户指定。
            # 直接推 :latest(用户要点的是"最新镜像",不用先想好版本号),附 :master。
            VERSION=$(git describe --tags --abbrev=7 2>/dev/null || echo "master-$SHORT_SHA")
            TAGS="$GHCR:latest,$GHCR:master,$DH:latest,$DH:master"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "resolved: version=$VERSION tags=$TAGS"

      - name: Build and push (amd64 only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ steps.meta.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
