name: build-and-push

# MusicFlow-V2 镜像发布(仅 GHCR,避免与 V1 的 musicflow 镜像同名冲突)。
#
# 触发:打 v* tag 时发布 ghcr.io/ray5378/musicflow-v2:<版本> + :latest;
# workflow_dispatch 手动触发时发布 :master(用于预发布验证)。
# 不在 push 分支时自动发版——加载项钉的是具体版本号,避免 master 提交悄悄
# 漂移 :latest,出问题无从回滚。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE_NAME: musicflow-v2

# 手动构建可被新触发打断;tag 构建必须跑完(发版不可取消)。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # Single-arch (amd64) build. No QEMU, no multi-arch manifest — the image is
  # pushed directly to <version> / :latest. ARM devices cannot run this image
  # (账号没有 ARM runner,与 V1 一致)。
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          GHCR=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V=${GITHUB_REF#refs/tags/v}
            VERSION="$V"
            TAGS="$GHCR:$V,$GHCR:latest"
          else
            # 手动构建:版本号用 git describe 生成,镜像只打 :master,不动 :latest。
            VERSION=$(git describe --tags --abbrev=7 2>/dev/null || echo "master-$SHORT_SHA")
            TAGS="$GHCR:master"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "resolved: version=$VERSION tags=$TAGS"

      - name: Build and push (amd64 only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ steps.meta.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
