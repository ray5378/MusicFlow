name: build-and-push

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE_NAME: musicflow

# Superseded main builds are pointless; tag builds must never be cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          GHCR=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          DH=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          # 每次构建(无论 tag 还是 main 推送)都移动 :latest,保证
          # docker pull musicflow:latest 永远是最新代码。
          # 版本号用 git describe 生成(最近 tag + 提交数 + sha, 如
          # 1.1.17-3-gabc1234),既真实可溯源,也不再显示无意义的 main-<sha>。
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V=${GITHUB_REF#refs/tags/v}
            VERSION="$V"
            TAGS="$GHCR:$V,$DH:$V,$GHCR:latest,$DH:latest"
          else
            VERSION=$(git describe --tags --abbrev=7 2>/dev/null || echo "main-$SHORT_SHA")
            TAGS="$GHCR:main,$DH:main,$GHCR:latest,$DH:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "resolved: version=$VERSION commit=$SHORT_SHA tags=$TAGS"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ steps.meta.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
