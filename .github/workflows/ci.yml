name: ci

# 每次 push(含 PR)验证:
#   1. 内置插件规范校验(scripts/check-builtins.mts)——manifest 合规/documentation 必填/能力映射
#   2. 框架核心插件化合规(scripts/check-core.mts)——核心不写死平台/provider、不直连内置插件实现
#   3. 前端插件隔离守卫(scripts/check-frontend-plugins.mjs)——插件配置/详情页仅渲染插件声明内容,
#      核心全局功能(媒体获取等)不得耦合进单个插件弹窗
#   4. i18n 合规守卫(scripts/check-i18n.mjs)——zh/en 键完全对齐 + 源码无硬编码中文
#   5. 后端类型检查 + 全量测试(含 OpenSubsonic 路由级、插件沙箱专项)
# 镜像发布仍由 build.yml(v* tag)负责,与本 CI 互不影响。

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-spec:
    name: 插件化规范校验(内置插件 + 框架核心)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: cd backend && npm ci
      - name: 校验 7 个内置插件 manifest 符合开发规范
        run: cd backend && DATA_DIR=$(mktemp -d) npx tsx scripts/check-builtins.mts
      - name: 校验框架核心符合功能插件化规范(不越界)
        run: cd backend && npx tsx scripts/check-core.mts

  frontend-plugin-isolation:
    name: 前端插件隔离守卫(弹窗不得耦合核心功能)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 零依赖 node 脚本,无需 npm install;与后端 check-core.mts 互为前后端对称守卫。
      - name: 校验插件管理页仅渲染插件声明内容
        run: node backend/scripts/check-frontend-plugins.mjs
      # 全局浮层遮挡守卫:任何 el-dialog/el-drawer/popover/tooltip/dropdown 必须
      # append-to-body/teleported 挂 body,否则渲染在页面滚动容器 stacking context 内
      # 会被底部播放条/全屏播放模式遮挡(全项目静态扫描,新增弹窗忘加直接 CI 失败)。
      - name: 校验全部浮层组件按约定处理(不被播放控件遮挡)
        run: node backend/scripts/check-frontend-overlays.mjs
      # Element Plus 暗色覆写守卫:任何 el-* 组件在 .vue/.ts 用了必须在 global.scss
      # 显式覆写,否则深色主题下透出白色/半透明底,用户感知不到"这是模态层"
      # (v1.7.59 事故:el-message-box 漏覆写 → 加入库二次确认弹窗底色全透明)。
      - name: 校验所有 el-* 组件均有暗色覆写
        run: node backend/scripts/check-element-overrides.mjs
      # 固定推荐歌单 ID 守卫:今日/本地/漫游歌单 id(pl-daily-*)永远固定,供音流等
      # 客户端稳定引用——核心/前端不得写死字面量(只能经 manifest.homePlaylistId /
      # fixedRecommend.ts 引用),防 ID 被改动导致音流断链。
      - name: 校验固定推荐歌单 ID 未被写死
        run: node backend/scripts/check-fixed-playlist-ids.mjs
      # i18n 合规守卫:zh/en 键完全对齐 + 前端源码(剔除注释)无硬编码中文,
      # 任何视图改动遗漏翻译/漏背 key 都归这里拦。
      - name: 校验 i18n 键对齐且源码无硬编码中文
        run: node backend/scripts/check-i18n.mjs

  test:
    name: 类型检查 + 全量测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: cd backend && npm ci
      - name: TypeScript 类型检查
        run: cd backend && npx tsc --noEmit
      # 全量测试含转码链路契约门禁:services/transcode.test.ts 的共享契约表与
      # 客户端 transcode-chain.yml 所跑向量完全一致,decideTranscode 一旦漂移即失败;
      # rest/transcodeStream.test.ts 用真实 ffmpeg 端到端验证 /rest/stream 转码。
      - name: 全量测试(含转码链路契约)
        shell: bash
        run: |
          set -o pipefail
          cd backend
          npx vitest run 2>&1 | tee /tmp/vitest.log
      - name: 上传失败日志(便于排查顺序相关偶发)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-log
          path: /tmp/vitest.log
          if-no-files-found: ignore
          retention-days: 3
