name: ci

# 每次 push(含 PR)验证:
#   1. 内置插件规范校验(scripts/check-builtins.mts)——manifest 合规/documentation 必填/能力映射
#   2. 框架核心插件化合规(scripts/check-core.mts)——核心不写死平台/provider、不直连内置插件实现
#   3. 前端插件隔离守卫(scripts/check-frontend-plugins.mjs)——插件配置/详情页仅渲染插件声明内容,
#      核心全局功能(媒体获取等)不得耦合进单个插件弹窗
#   4. i18n 合规守卫(scripts/check-i18n.mjs)——zh/en 键完全对齐 + 源码无硬编码中文
#   5. 渲染器进程隔离守卫(scripts/check-renderer-host.mjs)——墙钟节拍驱动的推流运行时
#      (sendspin/airplay)必须托管在 rendererHost 通用层的常驻子进程里,且不许自建 fork
#   6. 拖动 seek 精度守卫(scripts/check-seek-granularity.mjs)——所有拖拽 seek 目标
#      一律整秒(最小粒度 1 秒):非整秒目标会让 sendspin 子进程按 25ms 帧栅格取帧时
#      与窗口毫秒基准错位 → 微任务自旋 → 事件循环饿死 → 看门狗 SIGKILL
#   7. DLNA 实时发现守卫(scripts/check-dlna-realtime.mjs)——设备「实际已在线且在播」
#      必须尽快出现在 /v1/peers:alive 通告抓 description 失败必须放开去抖窗口、
#      `/v1/peers` 拉取要补扫、扫描间隔只能来自 scanPolicy 单一真源、
#      byebye 必须真标离线、扫描并发去重
#   8. 后端类型检查 + 全量测试(含 OpenSubsonic 路由级、插件沙箱专项)
#   9. 路径引用元守卫(scripts/check-workflow-paths.mjs)——workflow 与守卫脚本里出现的
#      仓库内路径必须真实存在(路径搬家/文件拆分后最易静默失同步:D13 一次踩了 7 处)
#  10. 音频输出格式链路守卫(scripts/check-audio-output-format.mjs)——采样率/位深的
#      「配置 → ffmpeg 命令」接线:osf 插入位置(splice(lnIdx+1,…) 不能被改成 push)、
#      源位深探测(自动档=跟随源)、player_rate_configs→player_output_configs 改名与
#      老库搬迁(删了调用线 CI 全绿但线上老库永远缺 manual_bits 列)、flow 位深贯通、
#      以及「播放器」页的输出配置入口(用户实际报过的缺陷:控件做在「音频」页)
#  11. 入库即入队守卫(scripts/check-import-trigger.mjs)——任何入库的网络歌曲都必须过
#      一轮下载流程:导入层广播(importOnlineSongs)/启动挂载(注册制,不挂=永远不下载)/
#      下载总开关/前端分栏白名单/i18n 逐处钉死(断了不报错,只会悄悄不下载)
#  12. 死链清理守卫(scripts/check-dead-song-purge.mjs)——连续 N 次「资源不存在类」失败
#      的网络歌移出曲库时:白名单不得混入可恢复码(否则误删还能在线播的歌)、
#      「转未匹配」必须先于删 songs 行(否则快照丢失再也拉不回来)、只删 web 行、
#      源整体故障保护不得丢(否则插件停用一次清空曲库)。破坏全是静默且不可逆的。
#  13. 下载任务取消/停止链路守卫(scripts/check-fetch-download.mjs)——「取消(排空:不开启新
#      条目,但已在下载/缓存待转码的歌必须走完落地)」与「完全停止(硬终止整个流程,含掐断
#      自动续批链)」两套语义、终态守卫(只能在 pending/running/cancelled 上落 cancelled,
#      绝不把 done 降级)、未开始条目补写、boot 恢复延迟与重入守卫、续批链无进展/零尝试
#      保护、/cancel 与 /force-stop 接线、前端取消/完全停止二次确认弹窗。破坏全是静默的:
#      任务行永久卡 running、已完成被降级成已取消、自动续批链无限复活。
#  14. 标签写入/修复链路守卫(scripts/check-tag-repair.mjs)——碟号纪律(不写也不留
#      DISCNUMBER/DISCTOTAL)、修复期保留内嵌封面(keepSourceCover 恒 true)、中文字形统一、
#      终态不可得标记(30 天 TTL 自愈)、待修口径=预筛−已标记、原子写、QQ 搜索端点
#      (search_for_qq_cp,client_search_cp 生产恒 500)与限流(1.2s+300~800ms 抖动)、
#      风格来源(info.genre.content 非 track_info.genre 数字码)、时长单位统一为秒。
#      破坏全是静默的:产出脏碟号、静默丢封面、候选池永不收敛、时长闸恒失败拿不到元数据。
#  15. 下载+标签修复独立覆盖率门禁(job fetch-coverage-gate,配置 vitest.coverage.config.ts)
#      ——只跑本链路测试,对 src/services/fetch/** 与内置标签来源(tagProvider/artistInfo)设
#      **硬阈值**,破了即 CI 红。与主配置的「阈值仅提示不阻断」互补。
#  16. 首页性能优化链路守卫(scripts/check-home-perf.mjs)——冷启动后台预热(共享在途单飞表 +
#      TTL 过滤 + 定时器 unref)、/v1/home/preload 聚合接口(复用 buildXxxPage + 双权限门)、
#      封面 v-lazy-cover 懒加载(rootMargin 200 且不退回原生 loading=lazy/size=300)、
#      收藏 loadFavorites 在途去重、首屏外呼分层(Home 下半屏两路与流转播放初始化的两次
#      全量 /v1/peers 一律延后到首屏绘制之后)。破坏全是静默的:首页又会退回冷启动硬等
#      2500ms、4 个预热请求争用 6 条 HTTP/1.1 连接、130 张封面全量预取、getStarred2 并发
#      两次、14 条 XHR 在首屏一次性并发把内容挤慢。
#  17. 媒体源扫描链路守卫(scripts/check-source-scan.mjs)——手动/定时扫描共用同一份可查询
#      运行状态(scanRunner)以支撑前端实时进度、定时走 startSourceScan 且并发让渡不落标记、
#      聚合接口 /v1/sources/scan-status、POST 与 PUT 同口径消毒定时两键、前端常驻轮询聚合
#      接口与定时配置 UI。破坏全是静默的:前端「只有完成后才有最终态」、定时扫描悄悄不触发。
#  18. `/rest/*` 鉴权豁免 + AirPlay 取流守卫(scripts/check-airplay-stream-auth.mjs)——
#      豁免清单单一真源(middleware/restExempt.ts,恰好三条取流端)、被豁免的 handler 必须
#      自带 token 校验(失败 403)、出流族两处分类(慢请求预算 + 探针避让闸)同步认 AirPlay。
#      破坏全是静默的:漏了 AirPlay 端 = 本机 ffmpeg 回环取流吃自家 401 → 0 字节 →
#      设备全程收不到 RTP,用户感知就是「AirPlay 连不上设备」(2026-10-20 HiVi H5MKII 实测)。
#  19. AirPlay ↔ DLNA 双协议互斥守卫(scripts/check-airplay-dlna-mutex.mjs)——AirPlay 起播
#      必须走单一助手,同步做两件事:冻结同 host DLNA 队列(QueueController.stopPlayback,
#      且先于 SOAP Stop)+ 下发 SOAP Stop;两个起播入口(in-proc/fork)口径不得分叉;
#      反向(DLNA 起播停同 host AirPlay 会话)也必须仍在。破坏全是静默的:只停 SOAP 时
#      DLNA 队列会自动续播反杀 AirPlay,用户感知就是「AirPlay 刚出声约 1 秒就被切走」
#      (2026-10-20 HiVi H5MKII 实测二阶反杀)。
#  20. AirPlay 解码 af 守卫(scripts/check-airplay-decode-af.mjs)—— 同一段音频只归一**一次**,
#      且唯一发生地是**出流侧公共链路**(resolveRequestAf,由 cast 判定给出 channel="airplay");
#      AirPlay 解码侧只做 RAOP 硬性输出段(44100Hz/16bit/stereo),不得再出现 loudnorm/alimiter/
#      volume=;同时**反向**钉死「出流侧的归一与音色 DSP 必须还在」,防「两处都删」把唯一那遍也删没。
#      破坏全是静默的:重复归一会让动态被二次压缩,用户感知只是「听着不对劲」(2026-10-20 实测复盘)。
#  21. AirPlay 播放链路时序守卫(scripts/check-airplay-playback-chain.mjs)——AirPlay 的 PLAYING
#      必须由**会话建立**时主动上报(不能只靠 5s 兜底轮询:乐观窗口会先超时 → 5s 判 stalled →
#      重投当前曲 / 自然结束的 IDLE 被窗口吞掉 / advancing 闸被占导致外部切歌被吞);IDLE 必须带
#      **真实落点**(写死 0 → 结束判据退化成 idle_early);被取代的旧会话**抑制**过期 IDLE(它属于
#      上一首、与新会话共用同一 playerId);in-proc/fork 两条路径同口径;pollState 必带 mediaUri。
#      破坏全是静默的:用户感知=「放完不自动下一首 / 重复播放同一首 / 不接受外部切歌」。
#  22. MfIcon 图标注册表守卫(scripts/check-mficon-registry.mjs)——前端所有 <MfIcon> 的静态
#      name 必须能在 MfIcon.vue 的 ICONS 注册表里解析,注册表自身每项也要有真实 lucide 组件
#      来源;并**反向**钉死「当前在用的 Airplay / ChevronUp / Pin 不得被摘掉」。破坏全是静默的:
#      名字没在册 → resolved 返回 null → 渲染空 span(vue-tsc 与既有测试都拦不住),
#      用户感知就是「这块怎么是空的」(2026-10-20 实报「AirPlay 设备在前端没有图标」)。
#  23. AirPlay RTSP 请求行守卫(scripts/check-airplay-rtsp-line.mjs)——RAOP 握手请求行必须是
#      三段式 `METHOD url RTSP/1.0`(RFC 2326);sendRtsp 与 fire-and-forget 的 sendRtspNoWait
#      两个分支都不得漏版本段,并反向断言不得再出现两段式写法。破坏全静默:真机容错吸收,
#      但标准合规接收端(shairport-sync 等)一律 400,用户感知「接收器连不上、放不出声」。
#  24. AirPlay2 发现分级守卫(scripts/check-airplay-ap2-discovery.mjs)——`_airplay._tcp`
#      只给「已由 `_raop` 建表的」设备打 supportsAp2,纯 AP2-only 广播不得造出设备;判据
#      必须是「有 `_airplay` 记录 && protovers ≥ 1.1」;`_airplay` down 必须撤能力而设备
#      可用性仍归 `_raop`;AP1 投屏入口(castToAirPlayDevice)不得提前分流。破坏全静默:
#      多出一批投不了的设备 / 所有设备都被判成 AP2 / 关掉 AP2 仍长期显示支持。
#  25. AirPlay ↔ Sendspin 桥接守卫(scripts/check-airplay-bridge.mjs)——Phase 8 的 17 条不变量:
#      ① 锚点链只许 host µs(hrtime.bigint)不得混 Date.now/performance.now/Unix ms;② latencyFrames
#      不得下沉归零;③ 时序常量唯一源且取值钉死(48000/44100、147/160、冷启动 lead 4500/2500ms、
#      桥缓冲上下限 384K/1536K、ANCHOR_SAFE_LEAD_US、0.3627);④ PCM 不得走 JSON/base64 IPC;
#      ⑤ 不得复活 start(anchorUnixMs);⑥ 组指令 fanOut 必须跳过桥占用设备;⑦ members 不得弱化成
#      Set<any>(编译期保护)也不得把 bridges 并进 members;⑧ commonSendAheadUs 体内不得吃桥 lead
#      (MAJ-01:并进去全组 +3.7s);⑨ pushFrame 必须留 pcm:100 虚拟组补偿(BLK-01);⑩ playGroupCore
#      与组关闭路径不得清 bridges(BLK-02);⑪ generation 必须取 epoch*1_000_003+timelineReseed、
#      rehost 不得 epoch++;⑫ RAOP RECORD 四锚点同域(baseTs 在赋值列表、先 >>> 0 再 % CHUNK_LEN);
#      ⑬ 不得伪造 acked、上报字段名必须 scheduledAnchorUs;⑭ 桥 socket 路径必须 mfab/<短 hash>,
#      deviceId/token 只进 sha1 输入不进文件名。破坏全是静默的:先晚 3.7 秒才出声、起播把桥会话
#      清掉只剩一路、锚点被墙钟回拨带歪后整组飘音、桥音频被组增益二次处理。
#      2026-10-26 追加 ⑮⑯⑰:锚点一次性(aligner 非空必须早退 —— 改群组延迟只能重建桥)、
#      群延迟补偿只有一个落点(firstFrameTsUs + anchorShiftUs,不得两头各加一次 = 双倍补偿)、
#      RAOP 重连退避双层封顶(指数项不封顶 ⇒ 永不重连;抖动项不封顶 ⇒ 重连风暴)。
#  26. 群组不变量守卫(scripts/check-group-invariants.mjs)——G1–G12:成员命名空间原样透传
#      (剥 dlna: 前缀 ⇒ 服务端按裸 id 比对、成员删不掉)、DLNA 禁入组(设备自拉流、组内没有
#      共享时间线)、起播即落位(AirPlay 新成员起点必须编进本次 cast,先起播再 seek 会让
#      单会话设备永久等待)、成员位置取 leader 真实落点(不得用墙钟/会话时长推算)、出流单泵
#      (pushFrame 唯一入口 + 桥侧不得自建选歌/判死分支)、组内换源上限 3 与判死负缓存 5 分钟、
#      延迟补偿只加在成员下发戳(污染 ring 的 tsUs ⇒ 桥投递窗口/水位/late-join 一起偏 = 整组飘音)、
#      watchdog 悬挂恢复必须走 resumeActive→playCurrent、内容同步 tick 判据字段仍在、
#      延迟参数域 ±30s/步进 10ms 单一源 + 写入必经 clamp + AirPlay 变更必须重建组桥、
#      延迟只在读视图不进 PlayerGroup 实体/persist、重复成员两种语义(全量 throw / 增量 no-op)。
#      破坏全是静默的:成员删不掉、两台机器各放各的、延迟调了没反应或偏一倍、整组飘音、
#      一首坏源让整组循环不收敛。断言只锚唯一表达式前缀、不锚参数个数,实现改签名不会假红。
# 镜像发布仍由 build.yml(v* tag)负责,与本 CI 互不影响。

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-spec:
    name: 插件化规范校验(内置插件 + 框架核心)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: cd backend && npm ci
      - name: 校验纳入清单的内置插件 manifest 符合开发规范
        run: cd backend && DATA_DIR=$(mktemp -d) npx tsx scripts/check-builtins.mts
      - name: 校验框架核心符合功能插件化规范(不越界)
        run: cd backend && npx tsx scripts/check-core.mts

  frontend-plugin-isolation:
    name: 前端插件隔离守卫(弹窗不得耦合核心功能)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 零依赖 node 脚本,无需 npm install;与后端 check-core.mts 互为前后端对称守卫。
      - name: 校验插件管理页仅渲染插件声明内容
        run: node backend/scripts/check-frontend-plugins.mjs
      # 全局浮层遮挡守卫:任何 el-dialog/el-drawer/popover/tooltip/dropdown 必须
      # append-to-body/teleported 挂 body,否则渲染在页面滚动容器 stacking context 内
      # 会被底部播放条/全屏播放模式遮挡(全项目静态扫描,新增弹窗忘加直接 CI 失败)。
      - name: 校验全部浮层组件按约定处理(不被播放控件遮挡)
        run: node backend/scripts/check-frontend-overlays.mjs
      # Element Plus 暗色覆写守卫:任何 el-* 组件在 .vue/.ts 用了必须在 global.scss
      # 显式覆写,否则深色主题下透出白色/半透明底,用户感知不到"这是模态层"
      # (v1.7.59 事故:el-message-box 漏覆写 → 加入库二次确认弹窗底色全透明)。
      - name: 校验所有 el-* 组件均有暗色覆写
        run: node backend/scripts/check-element-overrides.mjs
      # 固定推荐歌单 ID 守卫:今日/本地/漫游歌单 id(pl-daily-*)永远固定,供音流等
      # 客户端稳定引用——核心/前端不得写死字面量(只能经 manifest.homePlaylistId /
      # fixedRecommend.ts 引用),防 ID 被改动导致音流断链。
      - name: 校验固定推荐歌单 ID 未被写死
        run: node backend/scripts/check-fixed-playlist-ids.mjs
      # i18n 合规守卫:zh/en 键完全对齐 + 前端源码(剔除注释)无硬编码中文,
      # 任何视图改动遗漏翻译/漏背 key 都归这里拦。
      - name: 校验 i18n 键对齐且源码无硬编码中文
        run: node backend/scripts/check-i18n.mjs
      # MfIcon 图标注册表守卫:前端所有 <MfIcon> 的静态 name 必须能在 MfIcon.vue 的
      # ICONS 注册表里解析(direct / toPascal / ALIAS 同款四条路径)。名字没在册时 resolved
      # 返回 null → 渲染空 span,不报错、vue-tsc 也管不到(2026-10-20 用户实报「AirPlay 设备
      # 在前端没有图标」即此类:name="Airplay" 拼写正确但从未注册)。
      - name: 校验 MfIcon 图标名全部可解析(未在册 = 静默空白)
        run: node backend/scripts/check-mficon-registry.mjs

  # 渲染器进程隔离守卫:凡是「墙钟节拍驱动」的推流运行时(sendspin 25ms / airplay 7.98ms),
  # 必须托管在 backend/src/services/rendererHost 的常驻子进程里 —— 留在主进程会被 Web 请求、
  # 封面渲染、后台批量任务阻塞成掉帧断音。在此之前这条约定只有注释和 CHANGELOG 背书,
  # 没有任何 CI 拦它(2026-09-19 实测 7 个 check 脚本 + 8 个 workflow 关键词扫描 0 命中)。
  # 零依赖 node 脚本,秒级完成;同时禁止各业务自建 fork(必须复用通用宿主)。
  renderer-host-guard:
    name: 渲染器进程隔离守卫(节拍运行时必须在子进程)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验渲染器均接入通用宿主且节拍循环不在主进程
        run: node backend/scripts/check-renderer-host.mjs

  # 拖动 seek 精度守卫:所有「把用户拖动落点发往播放引擎」的目标一律整秒。
  # 2026-09-22 事故:HA 卡片 / 网页拖进度条后播放静默死掉(客户端正常)——根因是非整秒
  # 目标让 sendspin 子进程按 25ms 帧栅格取帧时与窗口的毫秒基准错位,陷入纯微任务自旋被
  # 65s 看门狗强杀。不报错、手测易当网络问题的**静默退化**,必须在 CI 钉死:
  #   后端唯一入口兜底 + 前端每个下发站点接线 + 引擎侧帧栅格/淘汰护栏仍在。
  # 零依赖 node 脚本,秒级完成。
  seek-granularity-guard:
    name: 拖动 seek 精度守卫(最小粒度 1 秒)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验拖拽 seek 目标均按整秒对齐
        run: node backend/scripts/check-seek-granularity.mjs

  # 首页性能优化链路守卫(2026-10-18)。四件套的共同点是**静默退化**:断了不报错、不会让任何
  # 既有动态用例变红,只会让首页悄悄变慢 —— 冷启动又退回 raceDeadline 硬等 2500ms、前端又
  # 拆回 4 个预热请求去争 6 条 HTTP/1.1 连接、130 张封面一次性全量预取、getStarred2(151KB)
  # 被并发请求两次。零依赖 node 脚本,秒级完成;每条断言都做过双向变异验证(改坏必红)。
  home-perf-guard:
    name: 首页性能优化链路守卫(冷启动预热/聚合接口/封面懒加载/收藏去重/首屏外呼分层)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验预热器接线/TTL 过滤/单飞共享、聚合接口复用与权限、懒加载与尺寸、在途去重、首屏外呼分层
        run: node backend/scripts/check-home-perf.mjs

  # 媒体源扫描链路守卫(2026-10-19)。契约的共同点是**静默退化**:断开不报错、不会让任何既有
  # 动态用例变红,只是让前端「只有完成后才有最终态」或让每源定时增量扫描悄悄不触发 ——
  # 进度未落 queryable 状态、定时退回直调 runBatchJob 丢进度、并发让渡误落标记顶掉当日定时、
  # 聚合接口被拆回单源轮询、POST 漏消毒定时两键落脏值。零依赖 node 脚本,秒级完成;
  # 每条断言都做过双向变异验证(改坏必红)。
  source-scan-guard:
    name: 媒体源扫描链路守卫(实时进度/定时共用/并发让渡/聚合接口)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验扫描状态收口/定时共用入口/并发让渡/聚合接口/配置消毒/前端常驻轮询
        run: node backend/scripts/check-source-scan.mjs

  # DLNA 实时发现守卫:设备「实际已在线且在播」必须尽快出现在 `/v1/peers`。
  # 2026-09-26 事故:主卧已播放很久,播放器列表里却没有它。根因是 alive 通告抓取
  # description 失败一次就静默丢弃,还白白耗掉 60s 去抖窗口 —— 设备刚上电时 SSDP 栈
  # 往往先于内嵌 HTTP 就绪,此刻必失败,于是这一次「上线」被彻底错过(230 模拟器实测:
  # HTTP 恢复后设备还要 85s 才可见)。不报错、手测易当网络问题的**静默退化**,钉死:
  #   周期扫描间隔单一真源 + 拉列表即补扫 + alive 失败放开去抖 + 按需广播 + 并发去重
  # 零依赖 node 脚本,秒级完成。
  dlna-realtime-guard:
    name: DLNA 实时发现守卫(上线即刻入列)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验上线即刻入列的接线(去抖放开/补扫/节奏真源/反向语义)
        run: node backend/scripts/check-dlna-realtime.mjs

  # `/rest/*` 鉴权豁免 + AirPlay 取流守卫(2026-10-20)。三条契约同时缺位就是「AirPlay 连不上
  # 设备」这个静默故障:取流端没被全局鉴权豁免 → 本机 ffmpeg 回环拉取吃自家 401 → 0 字节 →
  # 设备全程收不到 RTP;与此同时慢请求预算与探针避让闸也漏认它(告警噪音 + 起播窗口抢带宽)。
  # 零依赖 node 脚本,秒级完成;每条断言都做过双向变异验证(改坏必红)。
  airplay-stream-auth-guard:
    name: "`/rest/*` 鉴权豁免 + AirPlay 取流守卫(豁免合法性/自校验/出流族分类)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验豁免清单单一真源、handler 自校验 token、出流族两处分类同步
        run: node backend/scripts/check-airplay-stream-auth.mjs

  # 2026-10-20:AP1 修复后 AirPlay 已能出声,但首轮仅 129 chunks / 1.0s 就被打断 —— 只停了
  # 同 host DLNA 的 SOAP,没冻结它的队列,于是 DLNA 队列自动续播重新 castToDevice,把刚建立
  # 的 AirPlay 会话 TEARDOWN 掉。本 job 把「起播互斥必须同时冻队列 + 停 SOAP」钉死在 CI。
  # 零依赖 node 脚本,秒级完成;每条断言都做过双向变异验证(改坏必红)。
  airplay-dlna-mutex-guard:
    name: "AirPlay ↔ DLNA 双协议互斥守卫(冻队列先于停 SOAP / 两入口不分叉 / 反向仍在)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验单一助手、冻结先于 SOAP Stop、in-proc/fork 两入口同步、反向互斥仍在
        run: node backend/scripts/check-airplay-dlna-mutex.mjs

  # 2026-10-20:AirPlay 解码侧此前与出流侧**重复**做响度归一(同一段音频两遍,且顺序与
  # pipeline.ts 的「响度→DSP→限幅」契约相反 → 动态被二次压缩)。本 job 把「解码侧只做
  # RAOP 输出段、归一唯一发生地在出流侧公共链路」钉死在 CI。
  airplay-decode-af-guard:
    name: "AirPlay 解码 af 守卫(解码侧不得再归一 / 输出段仍在 / 归一仍在源头做)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验解码侧无 loudnorm、输出段 44.1k/16bit/stereo 仍在、出流侧归一与 DSP 仍在
        run: node backend/scripts/check-airplay-decode-af.mjs

  # 2026-10-20:AirPlay 只靠 5s 兜底轮询上报 PLAYING → 乐观窗口先超时,连锁出三条现网缺陷
  # (放完不自动下一首 / 重复播放同一首且未播完就从头循环 / 不接受外部切歌)。本 job 把
  # 「会话建立即主动上报 PLAYING(带 mediaUri)」「IDLE 带真实落点」「被取代的会话抑制过期
  # IDLE」「in-proc/fork 两条路径同口径」钉死在 CI。
  airplay-playback-chain-guard:
    name: "AirPlay 播放链路时序守卫(PLAYING 即时上报 / IDLE 真实落点 / 过期会话抑制)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 PLAYING 主动上报、IDLE 真实落点、stillCurrent 抑制、pollState 带 mediaUri
        run: node backend/scripts/check-airplay-playback-chain.mjs

  # 2026-10-20:RAOP 握手请求行缺 `RTSP/1.0` 版本段(`METHOD url` 两段式)。真机 HiVi 容错
  # 吸收所以长期未暴露;230 上用 shairport-sync 做接收端时对端直接 400(Bad Request),
  # 表现为「接收器连不上、一个字都放不出来」。本 job 把「sendRtsp / sendRtspNoWait 两个
  # 分支都必须拼三段式请求行」钉死在 CI,并反向断言不得再出现两段式写法。
  airplay-rtsp-line-guard:
    name: "AirPlay RTSP 请求行守卫(版本段不得省)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 sendRtsp / sendRtspNoWait 请求行均为 METHOD url RTSP/1.0
        run: node backend/scripts/check-airplay-rtsp-line.mjs

  # 2026-10-20(课题 E2):发现层分级。`_airplay._tcp` 只允许给「已由 `_raop` 建表的」
  # 设备打 supportsAp2 能力标记 —— 纯 AP2-only 广播不得造出设备(AP2 发送端未落地前
  # 它们投不了,进表只会变成「点了报错」的死设备);判据必须是「有 `_airplay` 记录 &&
  # protovers ≥ 1.1」,不得写死或依赖靠猜的 features 位;`_airplay` down 必须撤能力。
  airplay-ap2-discovery-guard:
    name: "AirPlay2 发现分级守卫(设备表唯一来源 / protovers 判据 / down 撤能力)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 _airplay 只打能力不建表、判据为 protovers ≥ 1.1、AP1 投屏入口未改
        run: node backend/scripts/check-airplay-ap2-discovery.mjs

  # Phase 8(桥接):AirPlay1/2 ↔ Sendspin 桥的 14 条静态不变量。守卫**只认非注释行**
  # (先剥 `//`、`/* */`、`<!-- -->` 再匹配),不会自己把自己查红;14 条都做过
  # 「造最小违规 → 必须红且只红这一条 → 还原即绿」的反证(反证脚本见 docs 复盘)。
  # 钉的都是踩过的坑:桥 lead 混进 commonSendAheadUs(MAJ-01 全组 +3.7s)、起播清 bridges
  # 导致桥会话消失(BLK-02)、缺 pcm:100 虚拟组使桥音频被组增益二次处理(BLK-01)、
  # generation 单世代号在重播种后撞值、RECORD 四锚点不同域导致 RTP 时间戳漂移。
  airplay-bridge-guard:
    name: "AirPlay↔Sendspin 桥接守卫(14 条:锚点/常量唯一源/虚拟组/世代号/socket 路径)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验桥接 14 条不变量(锚点链/常量唯一源/虚拟组补偿/世代号/RECORD 四锚点)
        run: node backend/scripts/check-airplay-bridge.mjs

  # 2026-09-27:后端路由按业务域拆分后,7 处路径耦合的静态守卫全部静默失同步
  # (3 处假红 + 3 处假绿)。守卫盯的是源码内容,却没人盯「源码还在不在那个位置」——
  # 本 job 补上这一层:workflow 与守卫脚本里写的仓库内路径必须真实存在。
  workflow-paths-guard:
    name: 路径引用元守卫(workflow/守卫脚本里的仓库路径必须存在)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 workflow 与守卫脚本引用的仓库内路径均存在
        run: node backend/scripts/check-workflow-paths.mjs

  # 群组维度(2026-10-26 新增):G1–G12 全部是**静默失效**类契约 —— 断了不报错,只表现为
  # 「成员删不掉」「两台机器各放各的」「延迟调了没反应 / 偏一倍」「整组飘音」「一首坏源整组循环」。
  # 与 airplay-*-guard 同构:零依赖 node 脚本,只读源码文本(先剥注释),不启动服务、不连设备。
  group-invariants-guard:
    name: "群组不变量守卫(G1–G12:成员前缀/DLNA 禁入/起播即落位/单泵/延迟补偿口径)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验群组 12 条不变量(成员命名空间/位置基准/出流单泵/延迟补偿/持久化口径)
        run: node backend/scripts/check-group-invariants.mjs

  # batch48/batch49 的输出格式链路(采样率 + 位深)。这批契约的共同点是**静默失效**:
  # 断了不报错、不会让任何既有测试变红,只让听感/体积悄悄变差,或让老库升级后
  # 功能永不生效(2026-10-08 用户报「播放器页根本没有采样率手动设置选项」即此类)。
  # 动态契约(真跑 ffmpeg 命令 / 真读文件头 / 真跑搬迁)见
  # backend/tests/services/playerOutputBits.test.ts、flowEncodeBits.test.ts、
  # playerRateDegrade.test.ts、backend/tests/db/legacyRateMigration.test.ts;
  # 本 job 补的是「这些动态用例的**前提**还在不在」(函数签名/插入位置/调用点/表名/入口符号)。
  # 零依赖 node 脚本,秒级完成;每条断言都做过双向变异验证(改坏必红)。
  audio-output-format-guard:
    name: 音频输出格式链路守卫(采样率/位深的接线与位置)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 osf 接线与插入位置 / 源位深探测 / 表改名与老库搬迁 / flow 贯通 / 播放器页入口
        run: node backend/scripts/check-audio-output-format.mjs

  # 默认输出编码统一 FLAC(D1,2026-10-20 任务A)。这条链的破坏是**静默的**:把
  # resolveChannelCodec 改回按源族分支(mp3→mp3 320 / m4a→aac 256 / ogg→opus 128 /
  # 未知→mp3 320)后不报错、不崩,只是 HTTP/DLNA/AirPlay 四端输出编码重新漂移。
  # 静态钉死「任何源后缀 → FLAC」与「DLNA 收敛为与公共决策一致」;运行时全量断言
  # (五类后缀 + 未知 + 无损源)见 backend/tests/services/pipeline.test.ts。
  # 零依赖 node 脚本,秒级完成;每条断言都做过反向变异验证(改回旧值必红)。
  audio-default-flac-guard:
    name: 默认输出编码统一 FLAC 守卫(五类源后缀 + 未知 → FLAC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 resolveChannelCodec 无按源族分支 / resolveDlnaOutput 收敛 / 默认接线未改 / 有损转码路径仍在
        run: node backend/scripts/check-audio-default-flac.mjs

  # 入库即入队守卫(产品定调 2026-10-11 的**最根本**一条:任何入库的网络歌曲都必须过一轮
  # 下载流程)。这条链断了**不报任何错** —— 导入照常成功、库里照常有行、歌单照常能看,
  # 只是「永远不会自动下载」,手测要等到用户抱怨「导入的歌怎么老是放不出来」才浮现。
  # 而它横跨 5 个文件 / 两套构建根:导入层广播 → 启动挂载(注册制,不挂=空实现) → fetch 层
  # 实现 → 前端分栏白名单 → i18n。任何一处被重构掉,功能都只剩「悄悄没了」。
  # 零依赖 node 脚本,秒级完成。
  import-trigger-guard:
    name: 入库即入队守卫(网络歌曲必须过一轮下载流程)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验导入层广播/启动挂载/下载总开关/分栏白名单/i18n 全部还在
        run: node backend/scripts/check-import-trigger.mjs

  # 死链清理(把连续永久失败的网络歌移出曲库)的静态钉子。这条链的破坏**静默且不可逆**:
  # 白名单混入可恢复码会误删「还能在线播放」的歌;转未匹配与删行顺序颠倒会让
  # external_* 快照丢失(歌单只剩「未知歌曲」,一键在线匹配再也拉不回来);去掉 web 行
  # 保护会连本地实体文件一起清掉;去掉源整体故障保护,插件停用一次就能清空整个曲库。
  # 零依赖 node 脚本,秒级完成。
  dead-song-purge-guard:
    name: 死链清理守卫(永久失效歌曲移出曲库的可逆性与安全性)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验白名单/转未匹配顺序/web 边界/快照回填/源故障保护/单轮上限/配置同步
        run: node backend/scripts/check-dead-song-purge.mjs

  # 下载任务取消/停止 + 标签写入/修复链路的静态钉子(详见文件头 13/14 条)。这两条链的破坏
  # 共同点是**静默失效**:断了不报错、不会让任何既有动态用例变红,只会让任务行永久卡 running、
  # 把已完成降级成已取消、让自动续批链无限复活,或产出脏碟号 / 静默丢内嵌封面 / 候选池永不
  # 收敛。零依赖 node 脚本,秒级完成;每条断言都做过双向变异验证(改坏必红)。
  fetch-download-tag-repair-guard:
    name: 下载取消/停止 + 标签写入修复守卫(静默失效契约)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验下载任务双控制器/取消/完全停止/终态守卫/续批链/前端二次确认
        run: node backend/scripts/check-fetch-download.mjs
      - name: 校验碟号纪律/保留内嵌封面/简繁统一/终态不可得/待修口径/QQ 端点与限流/时长单位
        run: node backend/scripts/check-tag-repair.mjs

  # 下载 + 标签修复链路的**独立覆盖率门禁**。主配置 vitest.config.ts 的阈值仅提示不阻断
  # (存量代码未全覆盖,一刀切会把无关模块的红算到本链路);本作业只跑本链路测试,对
  # src/services/fetch/** 与内置标签来源设硬阈值,破了即红。独立配置的另一个原因:主配置被
  # sendspin-guard / playback-chain-guard 等**子集**作业复用,glob 阈值会对空集合判 0 而假红。
  fetch-coverage-gate:
    name: 下载 + 标签修复覆盖率门禁(硬阈值)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: cd backend && npm ci
      - name: 跑本链路测试并校验覆盖率阈值(不足即失败)
        shell: bash
        env:
          MUSICFLOW_GUARD_NO_CONSOLE_INTERCEPT: "1"
        run: |
          set -o pipefail
          cd backend
          npx vitest run --config vitest.coverage.config.ts 2>&1 | tee /tmp/fetch-coverage.log
      - name: 上传失败日志
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-coverage-log
          path: /tmp/fetch-coverage.log
          if-no-files-found: ignore
          retention-days: 3

  test:
    name: 类型检查 + 全量测试
    runs-on: ubuntu-latest
    # 与 build.yml 保持一致:vitest 已切 singleFork 单进程串行(规避 forks 多 worker
    # 派发死锁),故无挂死风险,给 20 分钟为串行跑全集留足裕量。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: cd backend && npm ci
      - name: TypeScript 类型检查
        run: cd backend && npx tsc --noEmit
      - name: TypeScript 类型检查(backend/scripts 护栏)
        run: cd backend && npx tsc --noEmit -p tsconfig.scripts.json
      # 全量测试含转码链路契约门禁:services/transcode.test.ts 的共享契约表与
      # 客户端 transcode-chain.yml 所跑向量完全一致,decideTranscode 一旦漂移即失败;
      # rest/transcodeStream.test.ts 用真实 ffmpeg 端到端验证 /rest/stream 转码。
      - name: 全量测试(含转码链路契约)
        shell: bash
        # 关闭 vitest console 截获(与 backend/vitest.config.ts、sendspin-guard.yml 同源):
        # sendspin 测试文件停服务后仍有迟到 console 输出(自有 pushLoop / ws 关闭回调 +
        # 第三方 bonjour 名称冲突探测),经 Vitest 5 的 onUserConsoleLog worker→主进程 RPC
        # 在 worker teardown 时被判为 unhandled error,导致「全量用例全过」却 exit 1 —— 在
        # build.yml 会误触发回滚发版。关掉截获后日志仍完整落在 CI 日志与失败 artifact。
        env:
          MUSICFLOW_GUARD_NO_CONSOLE_INTERCEPT: "1"
        run: |
          set -o pipefail
          cd backend
          npx vitest run 2>&1 | tee /tmp/vitest.log
      - name: 上传失败日志(便于排查顺序相关偶发;含挂起被取消场景,取消防台同样回传)
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-log
          path: /tmp/vitest.log
          if-no-files-found: ignore
          retention-days: 3
