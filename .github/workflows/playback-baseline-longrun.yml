name: Playback Baseline Longrun

# 长跑：托管 runner 上跑 2 种拓扑的 3 小时版。
#
# 触发来源（两条，都非阻塞）：
#   - nightly：每天 UTC 19:00（次日 03:00 CST），盯 main 上的日常回归
#   - 每次发正式版（push v* tag）：盯这一版镜像在长会话下的表现
# 两者都不参与 tag 发版门禁——失败不影响 Release、不动镜像。Playback Baseline
# 的短跑才是门禁链路的一部分；长跑是发布后的追溯验证。
#
# 只补短跑抓不到的两类问题，不重复短跑已有的覆盖：
#   1. **缓慢劣化** —— 前段健康、后段缓冲持续上涨 / 提前量整体搬移。
#      全局 p50/p95 会被占多数的正常样本稀释，必须按 5 分钟分桶看斜率，
#      由 backend/scripts/baseline/longrun_trend.py 判。
#   2. **长会话** —— 桥会话反复重建 60 次、sendspin 连续推流 3 小时、
#      容器 RSS/FD 是否单调增长（resource.jsonl）。
#
# 与 playback-baseline.yml 完全独立：
#   - 独立 concurrency（单一组 + 自动轮转），不占发版体检的并发槽
#   - 只跑 mixed + ss-only：AP 单体拓扑的短跑已覆盖，长跑的价值在混合桥与纯帧通路
#
# 为什么定 3 小时（而不是 30 分钟或 6 小时）：
#   - 5 分钟一桶 → 36 桶，斜率的统计置信度比 30 分钟的 6 桶高一个量级
#   - 切歌间隔 180s（接近真实歌曲时长）→ 60 次切歌。若沿用 60s 间隔会变成
#     "180 次桥重建压力测试"，切歌冷启动还会污染分桶 p50，趋势判据失真
#   - GitHub 托管 runner 单 job 硬上限 6 小时（360min），且须含 pull/启动/判读
#     开销；3 小时留一半余量，不碰硬顶
#
# 证据包体积（免费账号 Artifact 配额仅 500MB）：3 小时的 base.jsonl + 帧日志
# 单拓扑可达百 MB 级。故只上传压缩后的判读证据（保留 2 天），完整 logs/ 目录
# 也仅在 job 失败时上传（保留 2 天）。不要改回全量裸文件上传。
# 另设 rotate-artifacts job：每轮结束调 GitHub API 删除更早 run 的同类 artifact，
# 只保留本轮 —— upload-artifact 的 overwrite 只在同一 run 内生效，跨 run 靠它没用。
#
# 播放侧硬判据由 playback_side_guard.py 统一判，共 11 项：泵活性间隔、首投 seek
# （按 会话×设备 判重）、flush 额度、自然接续零间隙+覆盖度、灌静音、fatal stall、
# 预取/曲末捷径复活等。短跑与本长跑共用同一脚本，只差样本量下限
# （short 20 / long 100 条 servo）；纯 sendspin 拓扑结构上无桥，servo 两项 SKIP。
# 自然接续证据由「短曲从头自然播完」产生（严禁 seek 到曲尾：会重建会话/打空桥缓冲，
# 制造假阳性），短曲按唯一 title=CI_SHORT_<n> 精确取，不按 id 差集猜。
# 判定口径见 docs/播放基线-基准值与判读-20261126.md「长跑」一节。

on:
  schedule:
    # 每天 UTC 19:00 = 次日 03:00 CST：避开真机白天播放，也错开发版高峰
    - cron: "0 19 * * *"
  # 每次发正式版跑一轮。tag push 时 build.yml 可能还在推镜像，
  # Resolve image 步骤会先等目标 tag 就绪再决定是否回退 latest。
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      minutes:
        description: "采样分钟数（标签/回看窗口；真实时长由切歌次数决定）"
        default: "180"
        required: false
      switch_count:
        description: "切歌次数（真实时长 = 次数 × 间隔）"
        default: "60"
        required: false
      switch_interval:
        description: "切歌间隔秒数（默认 180s，冒烟测试可临时改小）"
        default: "180"
        required: false
      image_tag:
        description: "镜像 tag（默认 main；留空或 main 时 tag 触发自动用该版本号）"
        default: "main"
        required: false

# 自动轮转：所有触发（nightly / tag / dispatch）共用一个组，新触发直接取消
# 仍在跑的旧长跑，永远只保留最新那一轮。发版时会立刻接管凌晨未完的 nightly；
# 被取消的那轮不上传证据包（它本就不参与门禁），旧 artifact 由 rotate job 清理。
concurrency:
  group: playback-baseline-longrun
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  actions: write   # rotate-artifacts job 需要删除旧 artifact

jobs:
  longrun:
    name: longrun ${{ matrix.topo }}
    runs-on: ubuntu-latest
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        topo: [mixed, ss-only]
    steps:
      - uses: actions/checkout@v4

      # aiosendspin 9.x 要求 Python >=3.12
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_IN: ${{ inputs.image_tag || 'main' }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER}/musicflow"
          # tag 触发且 dispatch 没显式指定镜像时，测这一版自己的镜像。
          if [ "$REF_TYPE" = "tag" ] && [ "$TAG_IN" = "main" ]; then TAG="$REF_NAME"; else TAG="$TAG_IN"; fi
          # GHCR 的镜像 tag 不带 v 前缀（v4.15.9 -> 4.15.9）
          TAG="${TAG#v}"
          IMAGE="${REPO}:${TAG}"
          echo "resolved tag=${TAG} (event=${{ github.event_name }})"
          # 先等目标 tag 就绪（最多 10 分钟）。不能先 fallback：
          # tag push 时 build.yml 正在推镜像，先 fallback 会永远测到 :latest。
          for i in $(seq 1 24); do
            if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then break; fi
            sleep 25
          done
          if ! docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::warning::${IMAGE} 10 分钟内不可用，回退 latest"
            IMAGE="${REPO}:latest"
            docker manifest inspect "$IMAGE" >/dev/null 2>&1 || {
              echo "::error::既没有 :${TAG} 也没有 :latest"; exit 2; }
          fi
          echo "image=${IMAGE}" | tee -a "$GITHUB_OUTPUT"

      - name: Run longrun playback and judge
        env:
          MF_IMAGE: ${{ steps.image.outputs.image }}
          MF_TOPO: ${{ matrix.topo }}
          MF_MINUTES: ${{ inputs.minutes || '180' }}
          MF_SWITCH_COUNT: ${{ inputs.switch_count || '60' }}
          MF_SWITCH_INTERVAL: ${{ inputs.switch_interval || '180' }}
          MF_STEADY_SEC: "90"
          MF_WORKDIR: ${{ runner.temp }}/mf-ci-long-${{ matrix.topo }}
        run: |
          set -o pipefail
          bash backend/scripts/baseline/ci_sim_playback.sh 2>&1 | tee /tmp/mf_longrun.log

      - name: Write job summary
        if: always()
        run: |
          {
            echo "### 长跑基线体检 — \`${{ matrix.topo }}\` / ${{
              inputs.minutes || '180' }}min"
            echo ""
            echo "触发：\`${{ github.event_name }}\` / ref：\`${{ github.ref_name }}\`"
            echo ""
            echo "镜像：\`${{ steps.image.outputs.image }}\`"
            echo ""
            echo "<details><summary>判读全文</summary>"
            echo ""
            echo '```'
            tail -100 /tmp/mf_longrun.log 2>/dev/null || echo "(无输出)"
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "> 本 workflow 不参与发版门禁：失败只表示长跑趋势异常，不影响 Release 与镜像。"
          } >> "$GITHUB_STEP_SUMMARY"

      # 免费账号 Artifact 配额 500MB：3 小时裸日志单拓扑百 MB 级，
      # 故只压缩上传判读必需文件；完整 logs/ 仅失败时留 2 天供排障。
      - name: Pack evidence
        if: always()
        env:
          WORK: ${{ runner.temp }}/mf-ci-long-${{ matrix.topo }}
        run: |
          set -euo pipefail
          [ -d "$WORK" ] || { echo "no workdir, skip pack"; exit 0; }
          cp /tmp/mf_longrun.log "$WORK/longrun.log" 2>/dev/null || true
          cd "$WORK"
          files=""
          # 播放侧证据必留：长会话最容易在曲末/切歌边界出问题，
          # 只判 A 层趋势会漏掉「水位全绿但泵提前收工」的空洞。
          for f in cap.json base.jsonl switch_log.jsonl sendspin_frames.jsonl resource.jsonl longrun.log playback_side.json logs/playback_side.log logs/short_phase_diag.log; do
            [ -f "$f" ] && files="$files $f"
          done
          if [ -n "$files" ]; then
            tar -czf "/tmp/baseline-longrun-${{ matrix.topo }}-${{ github.run_number }}.tar.gz" $files
            ls -lh "/tmp/baseline-longrun-${{ matrix.topo }}-${{ github.run_number }}.tar.gz"
          fi

      - name: Upload longrun evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-longrun-${{ matrix.topo }}-${{ github.run_number }}
          path: /tmp/baseline-longrun-${{ matrix.topo }}-${{ github.run_number }}.tar.gz
          if-no-files-found: warn
          retention-days: 2

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-longrun-logs-${{ matrix.topo }}-${{ github.run_number }}
          path: ${{ runner.temp }}/mf-ci-long-${{ matrix.topo }}/logs/
          if-no-files-found: warn
          retention-days: 2

  # 日志轮转：每轮结束删掉「更早 run」留下的同类 artifact，只留本轮。
  # 不用 upload-artifact 的 overwrite —— 它只在同一 run 内按名字覆盖，
  # 而 artifact 名带 run_number，跨 run 根本不同名，overwrite 无效。
  # 放在独立 job（needs longrun）而非 matrix 内：避免两个 job 同时列/删的竞态。
  rotate-artifacts:
    name: rotate old longrun artifacts
    runs-on: ubuntu-latest
    needs: longrun
    if: always()
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete artifacts from older runs
        run: |
          set -euo pipefail
          CUR="${{ github.run_number }}"
          echo "current run=${CUR}; rotating longrun artifacts"
          # 翻页拿全量，筛出本 workflow 的两类 artifact（证据包 + 失败日志）。
          # 名字形如 baseline-longrun-mixed-123 / baseline-longrun-logs-mixed-123，
          # 末尾数字即 run_number；只删 < CUR 的，本轮和并发的其他 run 不动。
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts --paginate \
            --jq '.artifacts[] | select(.name | startswith("baseline-longrun-")) | [.id, .name] | @tsv' \
          > /tmp/mf_artifacts.tsv
          deleted=0
          while IFS=$'\t' read -r id name; do
            [ -n "$id" ] || continue
            art_run="${name##*-}"
            case "$art_run" in
              ''|*[!0-9]*) continue ;;   # 名字尾部非数字，跳过不动
            esac
            if [ "$art_run" -lt "$CUR" ]; then
              echo "delete id=$id name=$name (run $art_run < $CUR)"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" \
                && deleted=$((deleted+1)) \
                || echo "::warning::删除 artifact $id 失败（可能已过期）"
            fi
          done < /tmp/mf_artifacts.tsv
          echo "rotated: deleted $deleted stale artifact(s)"
