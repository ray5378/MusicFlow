name: Playback Baseline

# 播放基线体检（三层，职责不同）
#
#   L0 sim-e2e（托管 runner，tag 触发）
#      —— 在 GitHub Actions 里自己起被测镜像 + 模拟接收端，真实建组/起播/
#         切歌 5 次/全程采样，再用绝对不变量判据判读。用 matrix 跑 5 种拓扑：
#           mixed / ap-only / ap1-only / ap2-only / ss-only
#         含 AirPlay 成员的组起 1~2 个 shairport-sync（RAOP 握手 + UDP 收流），
#         A 层 tick/ring-diag/deltaUs/inQueueMs 由 AirPlay 桥在**服务端**计算；
#         纯 sendspin 组没有桥、永远不会有 tick，改用 aiosendspin 拨入播放器
#         逐帧采 A_ssFrame（帧数/最大帧间隔/每次切歌后帧增量）。
#         两种接收端都起，才不会出现「某拓扑永远采不到证据」的假绿。
#         与 L1 一样不需要真机、不需要 self-hosted runner，但耗时 ~10 分钟。
#
#   L1 judge-selftest（托管 runner，blocking）
#      —— 判读器与容差阈值本身的回归。真机样本只能在能出声的内网采，
#         但「判据有没有被删掉、阈值有没有被悄悄放宽、设备失配会不会假绿」
#         完全可以用仓库内固化的三份真实样本（fixtures/）离线钉死。
#         这一层跑得快（秒级）、不依赖任何设备，所以 push / PR / tag 都跑。
#
#   L2 live-check（self-hosted，非阻塞）
#      —— 对现网真机采样后判读。**故意不放进 build.yml 的 needs 里**：
#         tag CI 的门禁失败会触发回滚 job，把已推的 GHCR/DockerHub 镜像
#         打回旧 digest。体检结果只作为发版后的观察报告，绝不允许它反过来动镜像。
#         默认关闭，需仓库变量 MF_LIVE_CHECK=true 且存在 [self-hosted, musicflow-live] runner。
#
# 判定口径见 docs/播放基线-基准值与判读-20261126.md；采集器示例见
# docs/examples/baseline_sampler.example.py（手册附录 C）。

on:
  push:
    branches: ["main"]
    # 发版必须触发 L0。若这里保留 paths 过滤，tag 指向的 commit 没改基线目录时
    # 整个 workflow 会被跳过 —— 「每次发版跑一轮」就落空了，故 push 不过滤路径，
    # 只有 PR 过滤（PR 只跑秒级 L1）。
    tags: ["v*"]
  pull_request:
    paths:
      - "backend/scripts/baseline/**"
      - "docs/examples/baseline_sampler.example.py"
      - "docs/播放基线-基准值与判读-*.md"
      - ".github/workflows/playback-baseline.yml"
  workflow_dispatch:
    inputs:
      window:
        description: "采样回看窗口（分钟）"
        default: "12"
        required: false
      live:
        description: "同时跑真机体检（需内网 self-hosted runner）"
        type: boolean
        default: false
      sim_minutes:
        description: "模拟播放采样分钟数（L0）"
        default: "8"
        required: false

concurrency:
  group: playback-baseline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  # ---------------------------------------------------------------------------
  # L0：托管 runner 上的模拟播放 + 基线不变量判读（发版时跑）
  # ---------------------------------------------------------------------------
  sim-e2e:
    name: simulated ${{ matrix.topo }} playback baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # 五种拓扑互不依赖：fail-fast=false 保证一个失败时其余四种仍出证据。
    strategy:
      fail-fast: false
      matrix:
        topo: [mixed, ap-only, ap1-only, ap2-only, ss-only]
    steps:
      - uses: actions/checkout@v4

      # aiosendspin 9.x 要求 Python >=3.12（3.11 上 pip 直接 no matching distribution）。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve released image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          V="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/musicflow:${V}"
          echo "image=${IMAGE}" | tee -a "$GITHUB_OUTPUT"
          # build.yml 与本 workflow 同时被 tag 触发，镜像可能还没推完：最多等 25 分钟。
          for i in $(seq 1 60); do
            if docker manifest inspect "${IMAGE}" >/dev/null 2>&1; then
              echo "镜像就绪（第 ${i} 次探测）"; exit 0
            fi
            sleep 25
          done
          echo "::error::25 分钟内未等到 ${IMAGE}；build.yml 可能失败或镜像为私有且 token 无权限"
          exit 2

      - name: Run simulated playback and judge
        env:
          MF_IMAGE: ${{ steps.image.outputs.image }}
          MF_TOPO: ${{ matrix.topo }}
          MF_MINUTES: ${{ inputs.sim_minutes || '8' }}
          MF_WORKDIR: ${{ runner.temp }}/mf-ci-sim-${{ matrix.topo }}
        run: |
          set -o pipefail
          bash backend/scripts/baseline/ci_sim_playback.sh 2>&1 | tee /tmp/mf_sim_run.log

      - name: Write job summary
        if: always()
        run: |
          {
            echo "### 模拟播放基线体检 — \`${GITHUB_REF_NAME}\` / \`${{ matrix.topo }}\`"
            echo ""
            echo "<details><summary>判读全文</summary>"
            echo ""
            echo '```'
            tail -80 /tmp/mf_sim_run.log 2>/dev/null || echo "(无输出)"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload simulated playback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-sim-${{ github.ref_name }}-${{ matrix.topo }}
          path: |
            ${{ runner.temp }}/mf-ci-sim-${{ matrix.topo }}/cap.json
            ${{ runner.temp }}/mf-ci-sim-${{ matrix.topo }}/base.jsonl
            ${{ runner.temp }}/mf-ci-sim-${{ matrix.topo }}/switch_log.jsonl
            ${{ runner.temp }}/mf-ci-sim-${{ matrix.topo }}/sendspin_frames.jsonl
            ${{ runner.temp }}/mf-ci-sim-${{ matrix.topo }}/playback_side.json
            ${{ runner.temp }}/mf-ci-sim-${{ matrix.topo }}/logs/playback_side.log
            ${{ runner.temp }}/mf-ci-sim-${{ matrix.topo }}/logs/short_phase_diag.log
            /tmp/mf_sim_run.log
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # L1：判读器回归（不需要真机）
  # ---------------------------------------------------------------------------
  judge-selftest:
    name: baseline judge selftest (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 语法体检：三个脚本 + 采样器示例都必须能编译（示例脚本曾因缩进/编码问题静默失活）
      - name: Python syntax check
        run: |
          set -o pipefail
          python3 -m py_compile \
            backend/scripts/baseline/baseline_cap.py \
            backend/scripts/baseline/baseline_guard.py \
            backend/scripts/baseline/invariant_guard.py \
            backend/scripts/baseline/longrun_trend.py \
            backend/scripts/baseline/summary_md.py \
            backend/scripts/baseline/selftest.py \
            backend/scripts/baseline/sendspin_frame_probe.py \
            backend/scripts/baseline/playback_side_guard.py \
            docs/examples/baseline_sampler.example.py
          echo "OK: py_compile 全部通过"

      # 核心：判读逻辑/阈值/退出码/多拓扑切歌与帧判据的回归断言。
      # 含播放侧硬判据（servo 冻结 / start-seek 洪水 / 曲末非零间隙 /
      # 灌静音 / fatal stall / 预取复活）的正反样本，失败即阻塞 push/PR。
      - name: Judge selftest (baseline invariants)
        run: |
          set -o pipefail
          python3 backend/scripts/baseline/selftest.py 2>&1 | tee /tmp/selftest.log

      - name: Upload selftest log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-selftest-log
          path: /tmp/selftest.log
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # L2：真机采样体检（内网 self-hosted；失败不阻塞任何发布动作）
  # ---------------------------------------------------------------------------
  live-check:
    name: live baseline (self-hosted, non-blocking)
    runs-on: [self-hosted, musicflow-live]
    timeout-minutes: 30
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.live) ||
      (startsWith(github.ref, 'refs/tags/v') && vars.MF_LIVE_CHECK == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Capture A-layer sample
        shell: bash
        env:
          MF_WATCH_DIR: ${{ vars.MF_WATCH_DIR }}
        run: |
          set -o pipefail
          D="${MF_WATCH_DIR:-/root/mf_watch}"
          W="${{ inputs.window }}"; if [ -z "$W" ]; then W=12; fi
          echo "watch_dir=$D window=${W}min ref=$GITHUB_REF_NAME"
          MF_WATCH_DIR="$D" python3 backend/scripts/baseline/baseline_cap.py \
            --window "$W" --label "ci-${GITHUB_REF_NAME}" --out /tmp/mf_ci_cap.json
          ls -l /tmp/mf_ci_cap.json

      # --strict-devices：基准里没有的设备也算 FAIL。发版体检必须开，
      # 否则设备重配（sendspin peerId 是 psk 派生 hash）后指标全不可比，守卫永久假绿。
      - name: Judge against committed baseline
        shell: bash
        id: verdict
        env:
          MF_WATCH_DIR: ${{ vars.MF_WATCH_DIR }}
        run: |
          set -o pipefail
          D="${MF_WATCH_DIR:-/root/mf_watch}"
          # 基准用**宿主机上的真实基准**（含真实设备 key）；仓库 fixtures 已脱敏，
          # 只能用于 selftest —— 拿它判真机样本会全员 strict FAIL（设备 key 对不上）。
          B="${D}/baseline/base_v4.15.8.json"
          if [ ! -f "$B" ]; then
            echo "::error::宿主机缺少真实基准 $B；先采一份：python3 $D/baseline_cap.py --window 24 --label official --out $B"
            exit 2
          fi
          MF_WATCH_DIR="$D" python3 backend/scripts/baseline/baseline_guard.py \
            --baseline "$B" \
            --input /tmp/mf_ci_cap.json --strict-devices 2>&1 | tee /tmp/mf_ci_verdict.txt

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          set -o pipefail
          {
            echo "### 播放基线体检 — \`${GITHUB_REF_NAME}\`"
            echo ""
            python3 backend/scripts/baseline/summary_md.py /tmp/mf_ci_cap.json || echo "| 采样文件 | 未生成 |"
            echo ""
            echo "<details><summary>判读全文</summary>"
            echo ""
            echo '```'
            cat /tmp/mf_ci_verdict.txt 2>/dev/null || echo "(无输出)"
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "> 本 job 不阻塞发布：镜像已在 build.yml 中推送完成，这里只做在线体检并留证据。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-live-${{ github.ref_name }}
          path: |
            /tmp/mf_ci_cap.json
            /tmp/mf_ci_verdict.txt
          if-no-files-found: warn
          retention-days: 30
