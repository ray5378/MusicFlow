name: Playback Chain Guard

# 播放链路专用门禁（blocking），与 ci.yml 的全量测试互补、与 build.yml（v* tag 发版）解耦。
# 钉死 2026-09-09 拍板的播放链路契约，防止被改坏：
#   1. /v1/dlna/stream-url 投前预检：签发无鉴权 token 前必须全类型确认有可用音源
#      （local 磁盘存在性 / web 探测换源；验不过 409，客户端直接跳下一首）
#      —— tests/routes/dlnaStreamUrlGuard.test.ts 五分支；
#   2. 服务端投 DLNA（QueueController）：不可播逐曲移除跳过，无停播阈值（队列自然排空）；
#   3. 换源缓存逐出：拉流实测失败必须逐出 fallbackCache/playableCache 重探，
#      插件源过期直链不得被缓存锁死（streamFallback 契约测试 + 全量回归）。
#   4. Web 前端投屏起播「主通道优先」：整份内容（歌单/专辑/艺人）点播必须走
#      POST /rest/api/v1/play {peerId, type, id, songId}，不得退化成整队推送。
#      原因：公网入口经 Lucky WAF，对 /queue/play 的大 JSON 数组有体积闸门
#      （≈90KB ≈ 300 首即 403，响应体 `<title>403 - Lucky WAF</title>`，反代拒绝）
#      —— 大歌单整队推送会直接起播失败。这是可用性要求，不是优化。
#      守卫：tests/frontend/playContentContract.test.ts（含 payload 级断言，
#      防止「请求体换成 startIndex 但 songId 变量还在」式漏检）。
# 客户端侧由 MusicFlow-client 仓库 .github/workflows/playback-chain-guard.yml 对称覆盖。

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: playback-chain-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playback-chain-guard:
    name: playback chain guard (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: cd backend && npm ci

      - name: Run playback chain guard tests
        shell: bash
        run: |
          set -o pipefail
          cd backend
          npx vitest run tests/routes/dlnaStreamUrlGuard.test.ts tests/routes/streamRemoteFallback.test.ts tests/source/online/streamFallback.test.ts tests/source/online/streamFallbackEvict.test.ts tests/player/QueueController.test.ts tests/player/queueChangedLeakGuard.test.ts tests/rest/scrobbleMethodGuard.test.ts tests/routes/queueTransfer.test.ts tests/frontend/playerContract.test.ts tests/frontend/playContentContract.test.ts tests/services/contentOrder.test.ts 2>&1 | tee /tmp/chain-guard.log

      # 静态守卫：QueueController 的停播阈值（skipCounters/连跳 N 停）已按
      # 2026-09-09 决策整体移除（不可播逐曲移除、队列自然排空），回归即失败。
      - name: "Guard - no stop threshold in QueueController"
        shell: bash
        run: |
          if grep -nE "skipCounters|连续 .* 首不可播,停止" backend/src/services/player/QueueController.ts ; then
            echo "::error::播放链路契约回归:QueueController 不允许重新引入停播阈值(2026-09-09 拍板:不可播逐曲移除,无限跳)"
            exit 1
          fi
          if grep -nE "deadSongs|localFailStreak|LOCAL_MAX_FAIL_STREAK" frontend/src/stores/player.ts ; then
            echo "::error::播放链路契约回归:Web 前端不允许重新引入 deadSongs/失败连击停播(2026-09-09 拍板:无限跳)"
            exit 1
          fi
          echo "OK: 无停播阈值/deadSongs 回归"

      # 静态守卫(不依赖 vitest):Web 前端「整份内容点播必须声明队列来源」。
      # 声明来源的 plumbing 断了 → contentOrigin 恒为 null → 永远走整队推送 →
      # 大歌单在 WAF 闸门上 403 起播失败。动态断言见 playContentContract.test.ts,
      # 这里再加一道源码级防线(源码扫描,不需要跑 vue/vitest)。
      - name: "Guard - Web main-channel-first origin plumbing"
        shell: bash
        run: |
          miss=0
          if ! grep -q "setContentOrigin" frontend/src/composables/usePlayContent.ts; then
            echo "::error::契约回归:usePlayContent 必须声明队列来源(setContentOrigin),否则永远走整队推送"
            miss=1
          fi
          if ! grep -q "/rest/api/v1/play" frontend/src/stores/player.ts; then
            echo "::error::契约回归:player.ts 必须实现主通道 /rest/api/v1/play(整队推送会被 WAF 403)"
            miss=1
          fi
          if ! grep -q "startCastPlaybackMainChannelFirst" frontend/src/stores/player.ts; then
            echo "::error::契约回归:startCastPlayback 必须委派给主通道优先实现,不得直接整队推送"
            miss=1
          fi
          if [ "$miss" -eq 0 ]; then echo "OK: 主通道优先 plumbing 在位"; fi
          exit "$miss"

      # 跨仓契约(服务端侧):客户端把「无可用音源」识别为 409 并转
      # DlnaSongUnplayableException 后跳下一首。服务端哪天把 409 改成 404/400
      # 或删掉 i18n key,两仓测试各自仍绿、线上直接失效 —— 这里钉死状态码与 key。
      # 客户端侧对称断言见 MusicFlow-client 的 playback-chain-guard.yml。
      - name: "Guard - 409 no-playable-source contract (cross-repo)"
        shell: bash
        run: |
          miss=0
          if ! grep -n "409" backend/src/routes/api/index.ts | grep -q "noPlayableSource"; then
            echo "::error::跨仓契约回归:/v1/dlna/stream-url 必须在返回 409 的同时给出 errors.song.noPlayableSource"
            miss=1
          fi
          if ! grep -q '"errors.song.noPlayableSource"' backend/src/i18n.ts; then
            echo "::error::跨仓契约回归:i18n 缺少 errors.song.noPlayableSource(中英双语)"
            miss=1
          fi
          if [ "$miss" -eq 0 ]; then echo "OK: 409 + i18n key 契约在位"; fi
          exit "$miss"

      # 队列流转端点(2026-09-16):快捷区拖拽「把 A 的队列给 B」的服务端侧。
      # 红线是**请求体不收 items** —— 队列实体本就在服务端(device_queues / local_queues),
      # 客户端零上传,几千首也是一次请求;若哪天被改成"客户端传 items",
      # 大歌单流转会在公网入口撞体积闸门而必然失败。
      - name: "Guard - queue transfer keeps zero-upload contract"
        shell: bash
        run: |
          miss=0
          if ! grep -q 'queue/transfer-from' backend/src/routes/api/index.ts; then
            echo "::error::队列流转回归:缺少 /peers/:peerId/queue/transfer-from 端点"
            miss=1
          fi
          if ! grep -q 'resolveBodyPeerId(c, from' backend/src/routes/api/index.ts; then
            echo "::error::队列流转回归:from 是 body 里的 peerId,必须经 resolveBodyPeerId 解析(否则把对外掩码当真实键,查不到队列)"
            miss=1
          fi
          if grep -q "req.json().*items.*from" backend/src/routes/api/index.ts; then
            echo "::error::队列流转回归:流转端点不得接收 items(零上传设计红线)"
            miss=1
          fi
          if [ "$miss" -eq 0 ]; then echo "OK: 队列流转端点 + 零上传契约在位"; fi
          exit "$miss"

      # —— 客户端(安卓 / Windows)链路守卫(2026-09-15) ——
      # 两条都是**静默失效**:WS 里多出一条 device_id 前端会直接忽略;scrobble 的 404
      # 被客户端 catch 吞掉 —— 都不会让任何既有测试变红,只能靠这里钉死。
      # 动态断言见 tests/player/queueChangedLeakGuard.test.ts 与
      # tests/rest/scrobbleMethodGuard.test.ts(均已做变异验证:回退修复即对应用例转红)。
      - name: "Guard - client link (queue_changed leak + scrobble method)"
        shell: bash
        run: |
          miss=0
          if ! grep -q 'this.queues.has(id)' backend/src/services/player/QueueController.ts; then
            echo "::error::客户端链路回归:预探测 onChange 必须只为已注册队列重发 queue_changed(this.queues.has(id) 守卫),否则本机链路会把带明文 clientId 的完整 peerId 塞进 WS device_id"
            miss=1
          fi
          if ! grep -q 'restRoutes.on(\["GET", "POST"\], "/scrobble"' backend/src/routes/rest/index.ts; then
            echo "::error::客户端链路回归:/rest/scrobble 必须同时接受 GET 与 POST;只听 GET 会让 ≤v5.0.1 的客户端静默丢失播放记录(404 被吞)"
            miss=1
          fi
          if [ "$miss" -eq 0 ]; then echo "OK: 客户端链路契约在位"; fi
          exit "$miss"

      # Web 前端「客户端实例状态自动跟上 + 离线自动踢出流转播放」(v3.0.19):
      # 客户端实例**没有任何携带当前曲的状态推送** —— 定时推的 peer_queue_changed 是
      # 摘要态(大队列 items 置空),而 player_state_changed / media_changed 是设备型事件
      # (canSeeDevice 只放行 dlna/airplay/sendspin)。所以只能靠定时刷新拉取全量
      # /v1/peers;关掉 App 后服务端要 10min 才判 idle,弹窗里会一直挂着那台客户端,
      # 故前端另用 lastActiveAt(30s 心跳)短阈值踢出。这几处 plumbing 任缺其一,
      # 表现都是「必须手动点重新扫描播放器」,单测覆盖不到,用源码扫描兜住。
      - name: "Guard - Web client peer auto-refresh + stale kick"
        shell: bash
        run: |
          miss=0
          # 后三项是「命令影子」(2026-09-16):客户端实例的音量/播放态与 position 一样是
          # 周期上报的采样,下发命令后轮询读到的仍是旧值,会把刚设的值顶回去
          # (音量 20→50→30 跳回 50;点了暂停又自己播起来)。单测覆盖不到,扫源码兜住。
          for pat in LOCAL_PEER_STALE_MS LOCAL_PEERS_POLL_MS isStaleLocalPeer startLocalPeersPoll stopLocalPeersPoll refreshPeersNow COMMAND_SHADOW_WINDOW_MS isStaleSample volumeIssuedAt transportIssuedAt; do
            if ! grep -q "$pat" frontend/src/stores/player.ts; then
              echo "::error::Web 前端客户端链路回归:player.ts 缺少 $pat(客户端实例状态不会自动更新)"
              miss=1
            fi
          done
          if [ "$miss" -eq 0 ]; then echo "OK: 客户端实例自动刷新/离线踢出 plumbing 在位"; fi
          exit "$miss"

      - name: Upload guard log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chain-guard-log
          path: /tmp/chain-guard.log
          if-no-files-found: ignore
          retention-days: 3
