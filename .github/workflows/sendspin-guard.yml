name: Sendspin Guard

# SENDSPIN 协议链路专用门禁（blocking），与 ci.yml 全量测试互补、与 build.yml（v* tag）解耦。
#
# 钉死 2026-09-30 ~ 10-01 三轮真机验证拍板的协议契约，防止被改坏：
#
#   P0 组状态三态（v4.0.6x）：group/update 的 playback_state 必须是
#       stopped / paused / playing 三态，对齐 MA PlaybackStateType。
#       此前「暂停 / 断网 / 播完」一律报 stopped，设备无法区分，
#       真机表现是「暂停后恢复播放从头开始」。三态是 P1 续播能生效的前提。
#       —— src/services/sendspin/groupStateTriad.test.ts
#
#   P1 暂停看门狗 + 续播（v4.0.70）：暂停 30s 转 stop 时 keepCurrent=true
#       保留 current/positionMs/paused；恢复播放必须把暂停位置透传到底层，
#       **fork（子进程）路径同样必须透传** —— 该路径漏参数是静默失效：
#       主进程测试跑 in-proc，全绿，只有真机 fork 模式才暴露（续播回 0）。
#       —— forkSeekContract.test.ts（协议层）+ 下方源码守卫（生产侧三点）
#
#   P2 切歌 keep_stream（2026-10-19 严格对齐 MA）：track change 只发 stream/clear
#       清缓冲，绝不发 stream/end；stream/end 只留给队列空 / 用户 stop / legacy 档。
#       legacy 档依据 MA playback.py:422-423（legacy 客户端在场强制 keep_stream=False，
#       allow_legacy_clients 默认 True）；非 legacy 档依据 MA player.py:1454
#       "The spec reserves stream/end for queue-empty, not track changes."
#       —— trackChangeKeepStream.test.ts
#
#   P5 帧级成员延迟补偿（v4.11.0）：组内每个成员的延迟补偿**逐帧、按成员**加在
#      下发时间戳上 —— `sendAudio(ts + sendspinDelayUsOf(clientId), data)`。
#       偏移只作用于「该成员收到的 ts」，ring / 桥投递仍用组时间线原戳；
#       迟入组(late-join)回填必须用**同一偏移**，否则新成员进场瞬间跳变。
#       静默失效形态：漏加偏移 → 该成员永远不生效；只加一处 → 进场/稳态不同步。
#       —— tests/sendspin/sendspinFrameDelay.test.ts
#
#   P6 下一首预解码开关（v4.11.0）：switcher 落在 sendspin-renderer 插件配置
#       `next_track_prefetch`（**缺省开**，显式 false 才关，读不到/坏 JSON 也开），
#       子进程直读 plugins 表（不缓存 ⇒ 改完下一首即生效）；
#       容器环境变量 `MF_BRIDGE_NEXT_TRACK_PREFETCH` 作排障总闸且**优先**于 Web 开关。
#       退回「缺省关」= 用户明明开着却不预取；丢掉 env 总闸 = 出问题关不掉。
#
# 为什么除了 vitest 还要源码扫描：上面三类里最危险的是**静默失效** ——
# 参数漏传 / 分支被短路时既有单测仍全绿，只有真机才暴露。源码守卫把
# 「符号必须在位」钉死，不依赖测试用例是否覆盖到那条路径。

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: sendspin-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sendspin-guard:
    name: sendspin protocol guard (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: cd backend && npm ci

      - name: Run sendspin guard tests
        shell: bash
        # 关闭 vitest console 截获(同位置注释见 backend/vitest.config.ts):本作业的
        # sendspin 测试文件在停服务后仍有异步收尾 console 输出(自有 pushLoop / ws 关闭
        # 回调 + 第三方 bonjour 名称冲突探测),会迟到到 worker teardown 之后;经 Vitest 5
        # 的 onUserConsoleLog RPC 派发时被判为 unhandled error,导致「98/98 全过」却 exit 1。
        env:
          MUSICFLOW_GUARD_NO_CONSOLE_INTERCEPT: "1"
        run: |
          set -o pipefail
          cd backend
          npx vitest run \
            src/services/sendspin/groupStateTriad.test.ts \
            src/services/sendspin/forkSeekContract.test.ts \
            src/services/sendspin/coldStartResume.test.ts \
            src/services/sendspin/pauseStopIpc.test.ts \
            src/services/sendspin/trackChangeKeepStream.test.ts \
            tests/sendspin/playerCoreUnits.test.ts \
            tests/sendspin/indexWrappers.test.ts \
            tests/sendspin/sendspinFrameDelay.test.ts 2>&1 | tee /tmp/sendspin-guard.log

      # —— P0：组状态三态表达式 ——
      # 退回两态（删掉 g.paused 分支）后设备无法区分暂停与断流，P1 续播随之失效。
      - name: "Guard P0 - group state triad (stopped/paused/playing)"
        shell: bash
        run: |
          if ! grep -qF 'const state = !g?.current ? "stopped" : g.paused ? "paused" : "playing";' backend/src/services/sendspin/server.ts; then
            echo "::error::P0 回归:group/update 必须是三态 !current→stopped / paused→paused / else→playing(删掉 paused 分支会让设备分不清暂停与断网,续播失效)"
            exit 1
          fi
          echo "OK: 组状态三态在位"

      # —— P1：暂停看门狗 + 续播（三条，含 fork 路径的生产侧）——
      # 测试只能钉死「消费侧参数到达 playerCore」；生产侧（谁把 seekPositionMs
      # 放进 RPC）漏传时消费侧测试仍绿 —— 故这里扫三个生产点。
      - name: "Guard P1 - pause watchdog keepCurrent"
        shell: bash
        run: |
          miss=0
          if ! grep -qF 'export const PAUSE_AUTO_STOP_MS = 30_000;' backend/src/services/sendspin/playerCore.ts; then
            echo "::error::P1 回归:缺少 PAUSE_AUTO_STOP_MS = 30_000(暂停转 stop 看门狗阈值)"
            miss=1
          fi
          if ! grep -qF 'export function stopCore(srv: SendspinServer | null, clientId: string, keepCurrent = false)' backend/src/services/sendspin/playerCore.ts; then
            echo "::error::P1 回归:stopCore 必须保留 keepCurrent 形参(看门狗转 stop 要留 current/positionMs,显式 stop 才全清)"
            miss=1
          fi
          if ! grep -qF 'if (!keepCurrent) {' backend/src/services/sendspin/playerCore.ts; then
            echo "::error::P1 回归:stopCore 缺少 if (!keepCurrent) 保护分支(会把看门狗的续播现场一起清掉)"
            miss=1
          fi
          if [ "$miss" -eq 0 ]; then echo "OK: 暂停看门狗 keepCurrent 在位"; fi
          exit "$miss"

      - name: "Guard P1 - resume position reaches fork RPC (producer side)"
        shell: bash
        run: |
          miss=0
          # 生产点1:单设备 fork 起播
          if ! grep -qF 'rpc("playMedia", { clientId, item, streamUrl, seekPositionMs: startMs })' backend/src/services/sendspin/protocolPlayer.ts; then
            echo "::error::P1 回归:protocolPlayer 的 playMedia RPC 必须带 seekPositionMs: startMs(漏传则 fork 模式续播回 0,主进程测试全绿看不出来)"
            miss=1
          fi
          # 生产点2:用户组 fork 起播。参数形态允许跨行(airplay 桥接参数按需追加),
          # 所以先把换行折成空格再比对:钉的仍是"四个参数按序在位"这件事,不是排版。
          if ! tr '\n' ' ' < backend/src/services/sendspin/index.ts | tr -s ' ' | grep -qF 'rpc("groupPlay", { group: groupName, members: memberIds, item, seekPositionMs: startMs,'; then
            echo "::error::P1 回归:groupPlay RPC 必须带 seekPositionMs: startMs(用户组 fork 续播回 0)"
            miss=1
          fi
          # 消费点:子进程必须把参数解出来传给 playCore / playGroupCore
          if [ "$(grep -cF 'p.seekPositionMs as number | undefined' backend/src/services/sendspin/childMain.ts)" -lt 2 ]; then
            echo "::error::P1 回归:childMain 必须在 playMedia 与 groupPlay 两处都解出 seekPositionMs"
            miss=1
          fi
          if [ "$miss" -eq 0 ]; then echo "OK: 续播位置透传链路(生产侧+消费侧)在位"; fi
          exit "$miss"

      # —— P2：切歌 keep_stream ——
      # 退回 stream/end 会让设备拆掉解码/扬声器上下文再重建：切歌出现gap，
      # 且组状态会闪一下 stopped（真机已实测过这条旧路径的问题）。
      - name: "Guard P2 - track change keeps the stream (clear, never end)"
        shell: bash
        run: |
          miss=0
          if ! grep -qF 'canKeepStream()' backend/src/services/sendspin/server.ts; then
            echo "::error::P2 回归:SendspinGroup 缺少 canKeepStream()(切歌门禁)"
            miss=1
          fi
          if ! grep -qF 'clearPlayback()' backend/src/services/sendspin/server.ts; then
            echo "::error::P2 回归:SendspinGroup 缺少 clearPlayback()(切歌只清缓冲,不发 stream/end)"
            miss=1
          fi
          n=$(grep -cF 'if (g.canKeepStream()) {' backend/src/services/sendspin/playerCore.ts)
          if [ "$n" -lt 2 ]; then
            echo "::error::P2 回归:playCore 与 playGroupCore 都必须走 canKeepStream() 分支(当前命中 $n 处,期望 2)"
            miss=1
          fi
          # 强制放开阀门:`=1` 时即便有 legacy 成员也走 keep_stream(临时对照用)
          if ! grep -qF 'MUSICFLOW_SENDSPIN_KEEP_STREAM_LEGACY' backend/src/services/sendspin/server.ts; then
            echo "::error::P2 回归:缺少 MUSICFLOW_SENDSPIN_KEEP_STREAM_LEGACY 回退阀门"
            miss=1
          fi
          if [ "$miss" -eq 0 ]; then echo "OK: 切歌 keep_stream 契约在位"; fi
          exit "$miss"

      # —— P3：过渡期不得报 stopped(MA:stopped 唯一产地 = 队列放完 / 用户 stop) ——
      # 自动切歌是「取消+续流」:过渡期只发 stream/clear(keep_stream)或 stream/end(legacy),
      # **绝不** group/update(stopped) —— 报 stopped 会让固件把它镜像成 IDLE 并锁死后续
      # stream/start(2026-10-19 真机无声实锤)。终态收尾由 stopCore 统一兜底。
      - name: "Guard P3 - no stopped during track change (silentState only)"
        shell: bash
        run: |
          miss=0
          n=$(grep -cF 'g.finishPlayback({ silentState: true });' backend/src/services/sendspin/playerCore.ts)
          if [ "$n" -lt 2 ]; then
            echo "::error::P3 回归:playCore/playGroupCore 过渡收尾必须走 finishPlayback({ silentState: true })(当前 $n 处,期望 ≥2;带 stopped 会造成固件 IDLE 闩锁无声)"
            miss=1
          fi
          if grep -qF 'this.group.finishPlayback();' backend/src/services/sendspin/streamEngine.ts; then
            echo "::error::P3 回归:streamEngine 不得再直接 finishPlayback()(自然曲终/linkDied 只置空 current,不发 stream/end+stopped)"
            miss=1
          fi
          if [ "$miss" -eq 0 ]; then echo "OK: 过渡期不报 stopped(silentState 收尾)在位"; fi
          exit "$miss"

      # —— P4：暂停中 seek 必须仍保持暂停（2026-10-21 真机实锤）——
      # GroupPump.seek() 内部为锚定新位置会 `if (paused) resume()`，紧随其后的
      # playCore 又会新建一个未暂停的泵 —— 两条路都会把「暂停中拖进度」变成
      # 「开始播放」。用户语义：拖动只改位置，暂停态不变（与 DLNA / AirPlay 一致）。
      # seekCore 必须在**每个返回点**用 wasPaused 兜回 pauseCore，漏一处就静默回退。
      - name: "Guard P4 - seek while paused stays paused"
        shell: bash
        run: |
          miss=0
          if ! grep -qF 'const wasPaused = !!g.paused;' backend/src/services/sendspin/playerCore.ts; then
            echo "::error::P4 回归:seekCore 缺少 wasPaused 快照(暂停中 seek 会变成开始播放)"
            miss=1
          fi
          n=$(grep -cF 'if (wasPaused) pauseCore(srv, clientId);' backend/src/services/sendspin/playerCore.ts)
          if [ "$n" -lt 3 ]; then
            echo "::error::P4 回归:seekCore 的三个返回点(无在播 / 起播窗口 / 重建流后)都必须补回暂停,当前命中 $n 处"
            miss=1
          fi
          if [ "$(grep -cF '(保持暂停)' backend/src/services/sendspin/playerCore.ts)" -lt 1 ]; then
            echo "::error::P4 回归:重建流日志缺少「(保持暂停)」标记,真机排障会失去判据"
            miss=1
          fi
          if [ "$miss" -eq 0 ]; then echo "OK: 暂停中 seek 保持暂停在位"; fi
          exit "$miss"

      # —— P5：帧级成员延迟补偿（v4.11.0）——
      # 偏移只加在「该成员收到的 ts」上（逐帧、按成员），ring/桥投递仍用组时间线原戳；
      # late-join 回填必须复用同一偏移。静默失效形态：单测桩 server 缺 groupDelayUs
      # 会兜底 0n，消费侧全绿而真机该成员永不生效 —— 所以这里钉生产侧三个点。
      - name: "Guard P5 - per-member frame delay offset (send + late-join)"
        shell: bash
        run: |
          miss=0
          SERV=backend/src/services/sendspin/server.ts
          if ! grep -qF 'for (const c of g.members) c.sendAudio(ts + this.sendspinDelayUsOf(c.clientId ?? ""), data);' "$SERV"; then
            echo "::error::P5 回归:帧下发必须是 sendAudio(ts + sendspinDelayUsOf(clientId), data)(漏加偏移 = 该成员补偿永远不生效)"
            miss=1
          fi
          if grep -qF 'c.sendAudio(ts, data)' "$SERV"; then
            echo "::error::P5 回归:仍存在未加成员偏移的 sendAudio(ts, data)(组内个别成员与其他人错位)"
            miss=1
          fi
          if ! grep -qF 'return typeof this.server.groupDelayUs === "function" ? this.server.groupDelayUs(this.name, clientId) : 0n;' "$SERV"; then
            echo "::error::P5 回归:sendspinDelayUsOf 必须委托 server.groupDelayUs,并对单测桩兜底 0n"
            miss=1
          fi
          if ! grep -qF 'return sendspinDelayUsOfClient(groupName, clientId);' "$SERV"; then
            echo "::error::P5 回归:SendspinServer.groupDelayUs 必须走 delayCalib 的 sendspinDelayUsOfClient(按成员格取值)"
            miss=1
          fi
          if ! grep -qF 'const dspDelayUs = this.sendspinDelayUsOf(c.clientId ?? "");' "$SERV"; then
            echo "::error::P5 回归:late-join 回填缺少成员偏移快照(新成员进场会比老成员早/晚一个补偿量)"
            miss=1
          fi
          if ! grep -qF 'for (const it of items) c.sendAudio(it.tsUs + dspDelayUs, it.data);' "$SERV"; then
            echo "::error::P5 回归:late-join 回填必须用同一偏移 it.tsUs + dspDelayUs"
            miss=1
          fi
          if [ "$miss" -eq 0 ]; then echo "OK: 帧级/迟入组回填的按成员补偿在位"; fi
          exit "$miss"

      # —— P6：下一首预解码开关（缺省开 + env 总闸优先）——
      # 开关落 plugins 表(子进程直读、不缓存);缺省开,仅显式 false 才关;
      # 环境变量 MF_BRIDGE_NEXT_TRACK_PREFETCH 优先于 Web 开关。
      - name: "Guard P6 - next-track prefetch switch (default on, env overrides)"
        shell: bash
        run: |
          miss=0
          SE=backend/src/services/sendspin/streamEngine.ts
          PREF=backend/src/services/sendspin/bridgePrefetchConfig.ts
          if ! grep -qF 'export function nextTrackPrefetchEnabled(): boolean {' "$SE"; then
            echo "::error::P6 回归:streamEngine 缺少 nextTrackPrefetchEnabled()(预解码态机的唯一开关入口)"
            miss=1
          fi
          if ! grep -qF 'const raw = process.env.MF_BRIDGE_NEXT_TRACK_PREFETCH;' "$SE"; then
            echo "::error::P6 回归:环境变量总闸 MF_BRIDGE_NEXT_TRACK_PREFETCH 被删(出问题关不掉预解码)"
            miss=1
          fi
          if ! tr '\n' ' ' < "$SE" | tr -s ' ' | grep -qF 'if (raw === "0" || raw === "false" || raw === "off") return false;'; then
            echo "::error::P6 回归:env 关闭档(0/false/off)缺失"
            miss=1
          fi
          if ! tr '\n' ' ' < "$SE" | tr -s ' ' | grep -qF 'if (raw === "1" || raw === "true" || raw === "on") return true;'; then
            echo "::error::P6 回归:env 强制开档(1/true/on)缺失"
            miss=1
          fi
          if ! grep -qF 'return readBridgePrefetchConfig();' "$SE"; then
            echo "::error::P6 回归:env 必须只作覆盖,未设置时仍要读 Web 开关(否则音频页的开关完全不生效)"
            miss=1
          fi
          if ! grep -qF "SELECT config FROM plugins WHERE id = 'sendspin-renderer' OR name = 'sendspin-renderer'" "$PREF"; then
            echo "::error::P6 回归:必须直读 plugins 表(走主进程内存缓存 = 子进程改了不生效)"
            miss=1
          fi
          if ! grep -qF 'return cfg?.next_track_prefetch !== false;' "$PREF"; then
            echo "::error::P6 回归:缺省必须为开(仅显式 false 才关);写成 != true 会让从未配置的用户直接失去预解码"
            miss=1
          fi
          if [ "$miss" -eq 0 ]; then echo "OK: 预解码开关(缺省开/env 优先/直读 plugins)在位"; fi
          exit "$miss"

      - name: Upload guard log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sendspin-guard-log
          path: /tmp/sendspin-guard.log
          if-no-files-found: ignore
          retention-days: 3
