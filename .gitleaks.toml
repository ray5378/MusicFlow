# gitleaks 配置:在默认规则集之上仅追加「路径豁免」,不改任何规则阈值。
[extend]
useDefault = true

# AP2 / HAP 协议测试向量:
#   backend/tests/fixtures/ap2/{transport,hap}_vectors.json 里是公开规格中的固定常量
#   (RFC 5869 HKDF 标准测试向量、HAP 规范示例的公钥/证明值),用于校验对端实现,
#   不是任何真实凭据。generic-api-key 规则按「关键词 + 相邻高熵串」命中,属误报。
#
# 不用 .gitleaksignore 指纹豁免的原因:指纹绑定「引入提交 + 行号」,fixture 一改
# 行号即失效,需反复追;路径豁免对本目录后续新增的向量同样生效。
[[allowlists]]
description = "AP2/HAP 协议测试向量(公开规格常量,非真实凭据)"
paths = ['''backend/tests/fixtures/ap2/''']
